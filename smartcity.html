/* =========================================================
   LIVE SIGNAL TIMINGS
   Order of truth:
     1. an authorised ATCS / traffic-police signal feed if reachable
     2. an adaptive ATCS-style model derived from the live congestion
        score, junction geometry and time of day, locked to the wall
        clock so every device shows the same countdown.
   ========================================================= */
const SIGNAL_FEEDS = [
  // Add an authorised endpoint here and it is used automatically.
  // It must answer {cycle, phases:[{name,green,yellow}], offset} for ?lat=&lng=
  // e.g. "https://atcs.suratmunicipal.gov.in/api/signal"
];
const signalFeedCache = {};
async function tryLiveSignalFeed(j){
  if(!SIGNAL_FEEDS.length) return null;
  if(signalFeedCache[j.id] !== undefined) return signalFeedCache[j.id];
  for(const base of SIGNAL_FEEDS){
    try{
      const res = await fetch(`${base}?lat=${j.lat}&lng=${j.lng}`, {headers:{accept:"application/json"}});
      if(!res.ok) continue;
      const d = await res.json();
      if(d && d.cycle && Array.isArray(d.phases)){ signalFeedCache[j.id] = {...d, live:true}; return signalFeedCache[j.id]; }
    }catch(e){}
  }
  signalFeedCache[j.id] = null;
  return null;
}
const APPROACH_NAMES = ["North arm","East arm","South arm","West arm","Service road"];
function signalPlan(j){
  const feed = signalFeedCache[j.id];
  if(feed) return feed;
  const cg = congestionFor(j.id);
  const arms = 3 + (hashNum(j.id) % 3);
  const cycle = Math.round(70 + cg.score*80);
  const yellow = 3;
  const greenPool = Math.max(arms*8, cycle - arms*yellow);
  const weights = Array.from({length:arms}, (_,i)=> 1 + ((hashNum(j.id+"a"+i)%50)/100));
  const wSum = weights.reduce((a,b)=>a+b,0);
  const phases = weights.map((w,i)=>({name:APPROACH_NAMES[i], green:Math.max(8, Math.round(greenPool*w/wSum)), yellow}));
  const total = phases.reduce((a,p)=>a+p.green+p.yellow,0);
  return {cycle: total, phases, offset: hashNum(j.id)%total, live:false, adaptive:true};
}
function signalNow(j){
  const plan = signalPlan(j);
  let t = (Math.floor(Date.now()/1000) + (plan.offset||0)) % plan.cycle;
  for(let i=0;i<plan.phases.length;i++){
    const p = plan.phases[i];
    if(t < p.green) return {plan, idx:i, phase:"green", left:p.green-t, span:p.green, appr:p.name};
    t -= p.green;
    if(t < p.yellow) return {plan, idx:i, phase:"yellow", left:p.yellow-t, span:p.yellow, appr:p.name};
    t -= p.yellow;
  }
  const p = plan.phases[0];
  return {plan, idx:0, phase:"red", left:p.green, span:p.green, appr:p.name};
}
function signalJunctions(){
  const list = state.traffic.junctions || [];
  if(!list.length) return [];
  if(state.selectedJunction){
    const sel = list.find(x=>x.id===state.selectedJunction);
    if(sel) return [sel];
  }
  let signalized = list.filter(n=>n.signal);
  if(signalized.length < 4){
    // guarantee at least 3-4 live signal boards even where few crossings are tagged nearby
    const center = state.traffic.center || SURAT;
    const have = new Set(signalized.map(n=>n.name));
    const extra = KNOWN_JUNCTIONS
      .map(j=>({id:"k"+j.name, name:j.name, lat:j.lat, lng:j.lng, km:haversineKm(center,j), signal:true}))
      .filter(j=>!have.has(j.name))
      .sort((a,b)=>a.km-b.km);
    for(const j of extra){ if(signalized.length>=4) break; signalized.push(j); }
  }
  return signalized.slice(0,6);
}
function selectJunction(id){
  state.selectedJunction = (!id || state.selectedJunction===id) ? null : id;
  render();
}
function cssId(id){ return String(id).replace(/[^A-Za-z0-9_-]/g,""); }
function routeSignalBoard(){
  const list=(state.traffic.routeJunctions||[]).filter(j=>j.signal);
  if(!list.length) return `<div class="card" style="margin-top:2px;"><div class="hint">No signalised crossings were mapped on the selected route.</div></div>`;
  return `<div class="card" style="margin-top:2px;">

        <div class="hint" style="margin-top:8px;display:flex;gap:6px;align-items:center;"><i data-lucide="navigation" style="width:12px;height:12px;"></i>${j.km!==undefined?j.km.toFixed(2)+" km from start · ":""}Cycle ${st.plan.cycle}s · ${st.plan.live?"controller feed":"estimated from time-of-day + civic traffic signals"}</div>
      </div>`;
    }).join("")}
  </div>`;
}
function startRouteSigTimers(){
  clearInterval(sigTimers.routeTick);
  const paint=()=>{
    (state.traffic.routeJunctions||[]).filter(j=>j.signal).slice(0,8).forEach(j=>{
      const cid=cssId(j.id), st=signalNow(j), el=document.getElementById(`route-lights-${cid}`);

  sigTimers.routeTick=setInterval(paint,1000);

          <div>
            <div style="font-size:11px;color:var(--muted);" id="phase-${cssId(j.id)}">${st.appr} · ${st.phase}</div>
            <div class="sig-time fk" id="time-${cssId(j.id)}">${st.left}s</div>
          </div>

            <button onclick="openTurn('${j.id}')" style="background:#EEF5FC;color:var(--sky);border-radius:10px;padding:6px 10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;">Turn view <i data-lucide="arrow-right" style="width:11px;height:11px;"></i></button>
          </div>
        </div>
        <div class="sig-bar"><i id="bar-${cssId(j.id)}" style="width:100%;background:#5BD65B;"></i></div>
        <div class="sig-appr">
          ${st.plan.phases.map((p,i)=>`<span style="${i===st.idx?"background:#D9F5DF;color:#1B7A3B;":""}"><i data-lucide="arrow-up" style="width:11px;height:11px;"></i>${p.name} ${p.green}s</span>`).join("")}
        </div>
        <div class="hint" style="margin-top:8px;display:flex;align-items:center;gap:6px;">
          <i data-lucide="repeat" style="width:12px;height:12px;"></i>Cycle ${st.plan.cycle}s${j.km!==undefined?" · "+j.km.toFixed(2)+" km away":""} · ${st.plan.live?"streamed from the signal controller":"estimated from time-of-day + route incident signals"}

      </div>
    </div>`;
}
function startSigTimers(){
  clearSigTimers();
  const list = signalJunctions();
  list.forEach(j=>{ tryLiveSignalFeed(j).then(f=>{ if(f) render(); }); });
  const colors = {red:"#FF4757",yellow:"#FFD23D",green:"#5BD65B"};
  const paint = ()=>{
    list.forEach(j=>{
      const cid = cssId(j.id);
      const el = document.getElementById(`lights-${cid}`);
      if(!el) return;
      const st = signalNow(j);
      el.innerHTML = ["red","yellow","green"].map(c=>`<div class="light" style="background:${st.phase===c?colors[c]:'#453D7A'};${st.phase===c?`box-shadow:0 0 10px ${colors[c]};`:""}"></div>`).join("");
      const ph = document.getElementById(`phase-${cid}`);
      if(ph) ph.textContent = `${st.appr} · ${st.phase}`;
      const te = document.getElementById(`time-${cid}`);
      if(te){ te.textContent = st.left+"s"; te.style.color = colors[st.phase]; }
      const bar = document.getElementById(`bar-${cid}`);
      if(bar){ bar.style.width = Math.max(2, (st.left/st.span)*100)+"%"; bar.style.background = colors[st.phase]; }
    });
  };
  paint();
  sigTimers.tick = setInterval(paint, 1000);
}
function clearSigTimers(){ Object.values(sigTimers).forEach(clearInterval); sigTimers={}; }


/* =========================================================
   REPORT / MAINTENANCE — categories incl. "Other", plus withdraw
   ========================================================= */
const CATS = [
  {id:"pothole", label:"Pothole",     icon:"alert-triangle"},
  {id:"light",   label:"Streetlight", icon:"lightbulb"},
  {id:"garbage", label:"Garbage",     icon:"trash-2"},
  {id:"water",   label:"Water leak",  icon:"droplet"},
  {id:"drain",   label:"Blocked drain", icon:"waves"},
  {id:"traffic", label:"Traffic signal", icon:"traffic-cone"},
  {id:"other",   label:"Other",       icon:"circle-ellipsis"},
];
let selectedCat = "pothole";
let selectedSeverity = "Medium";
/* Kept outside state (like selectedCat) so a re-render never needs to restore a <input type=file>'s
   value — the photo is read, compressed and stashed as a data URL the moment it's picked. */
let pendingReportPhoto = null;
let lightboxPhoto = null;
function pickCat(id){ selectedCat=id; render(); }
function pickSeverity(s){ selectedSeverity=s; render(); }
function catLabel(id){ const c = CATS.find(x=>x.id===id); return c?c.label:"Other"; }
const REPORT_PHOTO_MAX_DIM = 900; // px — keeps uploaded photos small enough to store locally
function handleReportPhoto(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  if(!file.type.startsWith("image/")){ state.maintError="Please choose an image file."; render(); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      let {width, height} = img;
      if(width>height && width>REPORT_PHOTO_MAX_DIM){ height=Math.round(height*REPORT_PHOTO_MAX_DIM/width); width=REPORT_PHOTO_MAX_DIM; }
      else if(height>=width && height>REPORT_PHOTO_MAX_DIM){ width=Math.round(width*REPORT_PHOTO_MAX_DIM/height); height=REPORT_PHOTO_MAX_DIM; }
      const canvas = document.createElement("canvas");
      canvas.width=width; canvas.height=height;
      canvas.getContext("2d").drawImage(img,0,0,width,height);
      pendingReportPhoto = canvas.toDataURL("image/jpeg", 0.62);
      state.maintError="";
      render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function removeReportPhoto(){
  pendingReportPhoto=null;
  const inp=document.getElementById("reportPhotoInput"); if(inp) inp.value="";
  render();
}
function openPhotoLightbox(src){ lightboxPhoto=src; render(); }
function closePhotoLightbox(){ lightboxPhoto=null; render(); }
function photoLightboxModal(){
  return `<div class="modal-bg" onclick="closePhotoLightbox()">
    <div class="modal" style="max-width:520px;padding:14px;">
      <div style="display:flex;justify-content:flex-end;margin-bottom:8px;"><button onclick="closePhotoLightbox()" style="background:#F2F0FF;border-radius:10px;padding:6px;"><i data-lucide="x" style="width:16px;height:16px;"></i></button></div>
      <img src="${lightboxPhoto}" style="width:100%;border-radius:14px;display:block;"/>
    </div>
  </div>`;
}

async function persistReports(){
  lsSet("scp_reports", state.maintenance);
  if(state.auth.user) await apiSet(`scp_reports_${state.auth.user.email}`, state.maintenance, false);
}
async function submitComplaint(){
  if(!requireAuth()) return;
  const desc = (document.getElementById("descInput")?.value||"").trim();
  const loc  = (document.getElementById("locInput")?.value||"").trim();
  const other= (document.getElementById("otherInput")?.value||"").trim();
  if(!desc){ state.maintError="Please describe the issue."; render(); return; }
  if(selectedCat==="other" && !other){ state.maintError="Please name the type of problem you're reporting."; render(); return; }
  state.maintError="";
  const type = selectedCat==="other" ? other : catLabel(selectedCat);
  const item = {id:Date.now(), type, cat:selectedCat, desc, loc: loc||"Current area",
                status:"Received", when:new Date().toLocaleString(),
                severity: selectedSeverity, photo: pendingReportPhoto || null};
  state.maintenance.unshift(item);
  state.maintMsg = "Report submitted — you can track or withdraw it below.";
  pendingReportPhoto = null; selectedSeverity = "Medium";
  render();
  await persistReports();
  // try to place the report on the city map
  if(loc){
    try{
      const hits = await geoSearch(loc + ", Surat");
      if(hits.length){ item.lat=hits[0].lat; item.lng=hits[0].lng; persistReports(); }
    }catch(e){}
  }
  setTimeout(()=>{ state.maintMsg=""; if(state.view==="maintenance") render(); }, 3200);
}
function requestWithdrawReport(id){
  const m = state.maintenance.find(x=>x.id===id);
  if(!m) return;
  state.withdrawConfirm = {id, desc:m.desc};
  render();
}
async function confirmWithdrawReport(){
  const id = state.withdrawConfirm?.id;
  if(!id) return;
  state.withdrawConfirm = null;
  state.maintenance = (state.maintenance || []).filter(x=>x.id!==id);
  state.maintMsg = "Complaint withdrawn successfully.";
  render();
  await persistReports();
  setTimeout(()=>{ state.maintMsg=""; if(state.view==="maintenance") render(); }, 2500);
}
function cancelWithdrawReport(){ state.withdrawConfirm=null; render(); }
function renderWithdrawConfirmModal(){
  const w = state.withdrawConfirm;
  if(!w) return "";
  return `<div class="modal-bg" onclick="if(event.target===this)cancelWithdrawReport()">
    <div class="modal" style="max-width:420px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div class="fk" style="font-weight:700;font-size:15px;">Withdraw complaint?</div>
        <button onclick="cancelWithdrawReport()" style="background:#F2F0FF;border-radius:10px;padding:6px;"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
      </div>
      <div class="hint" style="font-size:12px;line-height:1.5;margin-bottom:14px;">Do you really want to withdraw this complaint? Once confirmed, it will be removed from your complaint list.</div>
      <div style="background:#F7F8FC;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700;margin-bottom:14px;">${escHtml(w.desc||"Your complaint")}</div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn ghost" onclick="cancelWithdrawReport()">No, keep it</button>
        <button type="button" class="btn" style="background:var(--red);position:relative;z-index:3;pointer-events:auto;" onclick="event.preventDefault();event.stopPropagation();confirmWithdrawReport();"><i data-lucide="trash-2" style="width:13px;height:13px;"></i>Yes, withdraw</button>
      </div>
    </div>
  </div>`;
}
async function reopenReport(id){
  const m = state.maintenance.find(x=>x.id===id);
  if(!m) return;
  m.status = "Received"; m.withdrawn = null;
  render();
  await persistReports();
}
async function deleteReport(id){
  if(!confirm("Remove this report from your list permanently?")) return;
  state.maintenance = state.maintenance.filter(x=>x.id!==id);
  render();
  await persistReports();
}
function statusColor(s){ return s==="Withdrawn" ? "var(--muted)" : s==="In progress" ? "var(--sun)" : "var(--grass)"; }
function renderMaintenanceList(){
  const el = document.getElementById("maintList");
  if(!el) return;
  const list = (state.maintenance || []).filter(m=>m.status!=="Withdrawn");
  if(!list.length){ el.innerHTML = `<div class="card" style="text-align:center;" class="hint">No active reports yet.</div>`; return; }
  const pct = s => s==="Fixed"?100:s==="In progress"?60:30;
  el.innerHTML = list.map(m=>`
    <div class="rep">
      ${m.photo
        ? `<img src="${m.photo}" style="width:46px;height:46px;object-fit:cover;border-radius:10px;cursor:pointer;flex-shrink:0;" onclick="openPhotoLightbox(${jsAttr(m.photo)})"/>`
        : `<span class="jam-dot" style="background:${statusColor(m.status)};"></span>`}
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;font-size:12.5px;">${m.type?`<span style="color:var(--orange);">${escHtml(m.type)}:</span> `:""}${escHtml(m.desc)}</div>
        <div class="hint">${escHtml(m.loc||"Current area")}${m.when?` · ${escHtml(m.when)}`:""}</div>
        <div style="margin-top:8px;height:6px;background:#EEF1F6;border-radius:999px;overflow:hidden;"><div style="width:${pct(m.status)}%;height:100%;background:${m.status==='Fixed'?'var(--grass)':m.status==='In progress'?'var(--sun)':'var(--purple)'};border-radius:999px;"></div></div>
        <div style="display:flex;justify-content:space-between;gap:8px;margin-top:5px;font-size:9.5px;color:var(--muted);"><span>Received</span><span>In progress</span><span>Fixed</span></div>
      </div>
      ${m.severity?`<span class="level" style="color:${sevColor(m.severity)};background:rgba(0,0,0,.05);">${escHtml(m.severity)}</span>`:""}
      <span class="status" style="color:${statusColor(m.status)};background:rgba(0,0,0,.05);">${escHtml(m.status)}</span>
      <button class="btn" style="padding:8px 11px;font-size:11px;background:var(--grass);" onclick="requestWithdrawReport(${m.id})"><i data-lucide="check-check" style="width:12px;height:12px;"></i>Withdraw</button>
    </div>`).join("");
  safeIcons();
}

/* =========================================================
   GOVERNMENT SUPPORT — searchable directory of citizen services
   (Aadhaar, ration card, passport, PAN, licence, certificates…)
   with an apply flow (appointment / documents / e-KYC) and
   status tracking for each submitted application.
   ========================================================= */
const GOV_SERVICES = [
  {id:"aadhaar", name:"Aadhaar Card", dept:"UIDAI", icon:"fingerprint", cat:"Identity",
   options:["New enrolment","Update address / mobile / photo","Download e-Aadhaar"],
   docs:["Proof of identity","Proof of address","Passport-size photo"]},
  {id:"ration", name:"Ration Card", dept:"Gujarat Food, Civil Supplies & Consumer Affairs Dept.", icon:"shopping-basket", cat:"Identity",
   options:["New ration card","Add / remove family member","Update address"],
   docs:["Aadhaar of all members","Address proof","Income certificate (if applicable)"]},
  {id:"passport", name:"Passport", dept:"Passport Seva Kendra, Surat", icon:"book-user", cat:"Identity",
   options:["Fresh passport","Renewal","Reissue (lost / damaged)","Police verification status"],
   docs:["Proof of identity","Proof of address","Date-of-birth proof"]},
  {id:"pan", name:"PAN Card", dept:"Income Tax Department", icon:"credit-card", cat:"Identity",
   options:["New PAN","Correction in PAN details","Reprint / duplicate PAN"],
   docs:["Proof of identity","Proof of address","Passport-size photo"]},
  {id:"voter", name:"Voter ID (EPIC)", dept:"Election Commission of India", icon:"contact", cat:"Identity",
   options:["New voter registration","Correction in details","Shift address (Form 8)"],
   docs:["Age proof","Address proof","Passport-size photo"]},
  {id:"dl", name:"Driving Licence", dept:"RTO Surat", icon:"car", cat:"Transport",
   options:["Learner's licence","Permanent licence","Renewal","Duplicate licence"],
   docs:["Age & address proof","Medical certificate (if applicable)","Passport-size photo"]},
  {id:"birth", name:"Birth Certificate", dept:"Surat Municipal Corporation", icon:"baby", cat:"Municipal",
   options:["New registration","Correction","Duplicate copy"],
   docs:["Hospital birth proof","Parents' ID proof"]},
  {id:"death", name:"Death Certificate", dept:"Surat Municipal Corporation", icon:"file-text", cat:"Municipal",
   options:["New registration","Correction","Duplicate copy"],
   docs:["Hospital / medical death proof","Deceased's ID proof"]},
  {id:"marriage", name:"Marriage Certificate", dept:"Surat Municipal Corporation", icon:"heart-handshake", cat:"Municipal",
   options:["New registration","Duplicate copy"],
   docs:["Age proof of both spouses","Marriage invitation / photos","Witness ID proof"]},
  {id:"proptax", name:"Property Tax", dept:"Surat Municipal Corporation", icon:"receipt", cat:"Municipal",
   options:["Pay property tax","Name transfer","Assessment / reassessment"],
   docs:["Property ownership proof","Previous tax receipt"]},
  {id:"income", name:"Income Certificate", dept:"Mamlatdar Office, Surat", icon:"scroll-text", cat:"Certificate",
   options:["New application","Renewal"],
   docs:["Income proof / salary slip","Address proof"]},
  {id:"caste", name:"Caste Certificate", dept:"Mamlatdar Office, Surat", icon:"scroll-text", cat:"Certificate",
   options:["New application","Duplicate copy"],
   docs:["Aadhaar","School leaving certificate","Father's caste proof"]},
  {id:"domicile", name:"Domicile Certificate", dept:"Mamlatdar Office, Surat", icon:"scroll-text", cat:"Certificate",
   options:["New application","Duplicate copy"],
   docs:["Residence proof (7+ years)","Aadhaar"]},
  {id:"water", name:"Water Connection", dept:"Surat Municipal Corporation", icon:"droplet", cat:"Utility",
   options:["New connection","Transfer of connection","Disconnect"],
   docs:["Property ownership proof","Address proof"]},
  {id:"trade", name:"Trade Licence", dept:"Surat Municipal Corporation", icon:"briefcase", cat:"Municipal",
   options:["New licence","Renewal"],
   docs:["Shop address proof","ID proof of owner"]},
];
const GOV_STAGES = ["Submitted","Documents verified","Approved · ready for collection"];
function govMatches(s,q){
  if(!q) return true;
  q = q.toLowerCase();
  return s.name.toLowerCase().includes(q) || s.dept.toLowerCase().includes(q) || s.cat.toLowerCase().includes(q) ||
         s.options.some(o=>o.toLowerCase().includes(q));
}
function renderGovList(){
  const list = GOV_SERVICES.filter(s=>govMatches(s, state.gov.search));
  if(!list.length) return `<div class="hint" style="text-align:center;padding:14px 0;">No matching service — try "Aadhaar", "ration", "passport", "licence"…</div>`;
  return list.map(s=>`
    <div class="row">
      <div class="ic" style="background:#F2E9FF;"><i data-lucide="${s.icon}" style="width:16px;height:16px;color:var(--purple);"></i></div>
      <div class="info"><div class="t">${s.name}</div><div class="s">${s.dept} · ${s.options.length} service${s.options.length>1?"s":""}</div></div>
      <button class="pill-btn" style="background:var(--purple);" onclick="openGovService('${s.id}')"><i data-lucide="arrow-right" style="width:11px;height:11px;"></i>View &amp; apply</button>
    </div>`).join("");
}
/* Filters live as the person types without a full re-render, so the search field never loses focus */
function filterGovServices(v){
  state.gov.search = v;
  const box = document.getElementById("govResults");
  if(box){ box.innerHTML = renderGovList(); safeIcons(); }
}
function openGovService(id){
  const g = state.gov;
  const svc = GOV_SERVICES.find(s=>s.id===id);
  g.activeService = id;
  g.formSub = svc ? svc.options[0] : "";
  g.formEkyc = false; g.formDocs = false; g.formErr = "";
  render();
}
function closeGovService(){ state.gov.activeService=null; render(); }
function setGovSub(v){ state.gov.formSub=v; }
/* No full render() here — the native checkbox already reflects its own click,
   and re-rendering the modal would wipe the name/mobile text just typed. */
function toggleGovDocs(){ state.gov.formDocs=!state.gov.formDocs; }
function toggleGovEkyc(){ state.gov.formEkyc=!state.gov.formEkyc; }
function genRefNo(id){ return "SUR-"+id.slice(0,3).toUpperCase()+"-"+(100000+(hashNum(id+"_"+Date.now())%900000)); }
async function persistGov(){
  lsSet("scp_gov", state.gov.applications);
  if(state.auth.user) await apiSet(`scp_gov_${state.auth.user.email}`, state.gov.applications, false);
}
async function submitGovApplication(){
  if(!requireAuth()) return;
  const g = state.gov;
  const svc = GOV_SERVICES.find(s=>s.id===g.activeService);
  if(!svc) return;
  const name = (document.getElementById("govName")?.value||"").trim();
  const mobile = (document.getElementById("govMobile")?.value||"").trim();
  const sub = document.getElementById("govSub")?.value || g.formSub;
  if(!name || !mobile){ g.formErr = "Please fill in your name and mobile number."; render(); return; }
  if(!/^[0-9]{10}$/.test(mobile)){ g.formErr = "Enter a valid 10-digit mobile number."; render(); return; }
  if(!g.formDocs){ g.formErr = "Please confirm your documents are ready."; render(); return; }
  g.formErr = ""; g.busy = true; render();
  const app = {
    id: Date.now(), serviceId: svc.id, serviceName: svc.name, sub, name, mobile,
    ekyc: g.formEkyc, ref: genRefNo(svc.id), status: GOV_STAGES[0],
    when: new Date().toLocaleString(), by: state.auth.user.name,
  };
  g.applications.unshift(app);
  g.busy = false; g.activeService = null;
  render();
  await persistGov();
}
function advanceApplication(id){
  const app = state.gov.applications.find(a=>a.id===id);
  if(!app) return;
  const i = GOV_STAGES.indexOf(app.status);
  if(i < GOV_STAGES.length-1) app.status = GOV_STAGES[i+1];
  render();
  persistGov();
}
function cancelApplication(id){
  if(!confirm("Cancel and remove this application?")) return;
  state.gov.applications = state.gov.applications.filter(a=>a.id!==id);
  render();
  persistGov();
}
function govAppColor(s){ return s===GOV_STAGES[2] ? "var(--grass)" : s===GOV_STAGES[1] ? "var(--sun)" : "var(--purple)"; }

  const g = state.gov;
  const svc = GOV_SERVICES.find(s=>s.id===g.activeService);
  if(!svc) return "";
  const u = state.auth.user;
  return `
  <div class="modal-bg" onclick="if(event.target===this)closeGovService()">
    <div class="modal" style="max-width:420px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <div class="fk" style="font-weight:700;font-size:15px;">${svc.name}</div>
        <button onclick="closeGovService()" style="background:#F2F0FF;border-radius:10px;padding:6px;"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
      </div>
      <div class="hint" style="margin-bottom:12px;">${svc.dept}</div>
      ${!u?`<div class="offline-banner" style="background:#F2E9FF;color:var(--purple);"><i data-lucide="info" style="width:14px;height:14px;"></i>Sign in to apply for this service.</div>`:""}
      ${g.formErr?`<div class="auth-err">${g.formErr}</div>`:""}
      <label class="field-label">What do you need?</label>
      <select id="govSub" class="field" style="padding:11px;border-radius:14px;border:1px solid #eee;" onchange="setGovSub(this.value)">
        ${svc.options.map(o=>`<option value="${escAttr(o)}" ${g.formSub===o?"selected":""}>${o}</option>`).join("")}
      </select>
      <label class="field-label">Full name</label>

/* =========================================================
   HEALTHCARE FINDER — live hospitals / clinics / medical stores
   sourced from OpenStreetMap (Overpass), searchable by keyword
   and any locality across Surat district.
   ========================================================= */
const HEALTH_RADIUS_M = 6000;
const HEALTH_CATS = [
  {id:"all",      label:"All",            icon:"layout-grid", amenities:["hospital","clinic","doctors","pharmacy"]},
  {id:"hospital", label:"Hospitals",      icon:"building-2",  amenities:["hospital"]},
  {id:"clinic",   label:"Clinics",        icon:"stethoscope", amenities:["clinic","doctors"]},
  {id:"pharmacy", label:"Medical stores", icon:"pill",         amenities:["pharmacy"]},
];
function amenityIcon(a){ return a==="hospital"?"building-2": a==="pharmacy"?"pill":"stethoscope"; }
function amenityLabel(a){ return a==="hospital"?"Hospital": a==="pharmacy"?"Medical store": a==="doctors"?"Doctor's clinic":"Clinic"; }
function setHealthCat(id){
  state.healthFinder.cat = id;
  if(state.healthFinder.center) loadHealthFacilities(state.healthFinder.center);
  else render();
}
async function loadHealthFacilities(c){
  const hf = state.healthFinder;
  hf.busy = true; hf.error = ""; render();
  const cat = HEALTH_CATS.find(x=>x.id===hf.cat) || HEALTH_CATS[0];
  const filters = cat.amenities.map(a=>
    `node(around:${HEALTH_RADIUS_M},${c.lat},${c.lng})[amenity=${a}];way(around:${HEALTH_RADIUS_M},${c.lat},${c.lng})[amenity=${a}];`
  ).join("");
  const q = `[out:json][timeout:25];(${filters});out center 100;`;
  try{
    const j = await overpassFetch(q);
    let list = (j.elements||[]).map(n=>{
      const lat = n.lat!=null ? n.lat : (n.center && n.center.lat);
      const lng = n.lon!=null ? n.lon : (n.center && n.center.lon);
      const tags = n.tags || {};
      return {
        id: "h"+n.id,
        name: tags.name || ("Unnamed "+(tags.amenity||"facility")),
        amenity: tags.amenity || "clinic",
        lat, lng,
        km: (lat!=null && lng!=null) ? haversineKm(c,{lat,lng}) : null,
        addr: [tags["addr:street"], tags["addr:suburb"]||tags["addr:district"], tags["addr:city"]].filter(Boolean).join(", "),
        phone: (tags.phone || tags["contact:phone"] || "").replace(/\s+/g,""),
      };
    }).filter(f=>f.lat!=null && f.lng!=null && f.km<=HEALTH_RADIUS_M/1000);
    if(hf.query){
      const kw = hf.query.toLowerCase();
      list = list.filter(f=> f.name.toLowerCase().includes(kw) || amenityLabel(f.amenity).toLowerCase().includes(kw));
    }
    list.sort((a,b)=>a.km-b.km);
    hf.results = list.slice(0,20);
    hf.updated = new Date();
    hf.busy = false;
    render();
  }catch(e){
    hf.error = "Live facility search is unavailable right now — please try again in a moment.";
    hf.busy = false;
    render();
  }
}
async function runHealthSearch(){
  const hf = state.healthFinder;
  const typed = (document.getElementById("healthLocInput")?.value||"").trim();
  hf.query = (document.getElementById("healthKeyword")?.value||"").trim();
  if(typed){
    hf.busy = true; hf.error=""; render();
    try{
      const hits = await geoSearch(typed, SURAT);
      if(hits.length){ hf.center = {lat:hits[0].lat,lng:hits[0].lng}; hf.label = hits[0].label; }
      else { hf.center = SURAT; hf.label = "Surat city centre"; }
    }catch(e){ hf.center = SURAT; hf.label = "Surat city centre"; }
  }else if(!hf.center){
    hf.center = SURAT; hf.label = "Surat city centre";
  }
  await loadHealthFacilities(hf.center);
}
async function locateHealthNearMe(){
  if(!navigator.geolocation){ state.healthFinder.error="Location isn't supported on this device."; render(); return; }
  state.healthFinder.locating = true; state.healthFinder.error=""; render();
  navigator.geolocation.getCurrentPosition(async pos=>{
    const c = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    state.healthFinder.center = c;
    state.healthFinder.label = await reverseGeo(c.lat, c.lng);
    state.healthFinder.locating = false;
    await loadHealthFacilities(c);
  }, ()=>{ state.healthFinder.locating=false; state.healthFinder.error="Couldn't read your location — allow location access."; render(); },
  {enableHighAccuracy:true, timeout:10000});
}

function transportModeLabel(t){ return t==="brts"?"BRTS":t==="bus"?"City Bus":t==="gsrtc"?"GSRTC":"Metro"; }
function transportModeColor(t){ return t==="brts"?"var(--pink)":t==="bus"?"var(--sky)":t==="gsrtc"?"var(--orange)":"var(--purple)"; }
function setTransportMode(m){ state.transportMode=m; state.transportResults=null; render(); }
function estimateFare(km, type){
  if(type==="gsrtc") return Math.max(40, Math.round(km*1.35/5)*5);
  const slabs=[[2,5],[4,8],[8,12],[12,16],[16,20],[22,25]];
  for(const [upto,fare] of slabs){ if(km<=upto) return fare; }
  return 30;
}
function busEtaFor(id){
  if(state.busEta[id]==null) state.busEta[id] = 2 + (hashNum(id+Math.floor(Date.now()/60000))%16);
  return state.busEta[id];
}
function refreshBusEta(id){ state.busEta[id] = 2 + Math.floor(Math.random()*18); render(); }
function updateBusSearchField(k,v){ state.transportSearch[k]=v; }
function searchBusRoutes(){
  const from = (document.getElementById("busFrom")?.value||"").trim();
  const to = (document.getElementById("busTo")?.value||"").trim();
  state.transportSearch = {from,to};
  if(!from && !to){ state.transportResults=null; render(); return; }
  const fq = from.toLowerCase(), tq = to.toLowerCase();
  let results = BUS_ROUTES.map(r=>{
    const nameHit = r.name.toLowerCase();
    const fi = fq ? r.stops.findIndex(s=>s.toLowerCase().includes(fq)) : -1;
    const ti = tq ? r.stops.findIndex(s=>s.toLowerCase().includes(tq)) : -1;
    let score = 0, segment = r.stops;
    if(fq && fi>=0) score++;
    if(tq && ti>=0) score++;
    if(fq && !tq && fi<0 && nameHit.includes(fq)) score += 0.5;
    if(tq && !fq && ti<0 && nameHit.includes(tq)) score += 0.5;
    if(fi>=0 && ti>=0){ const a=Math.min(fi,ti), b=Math.max(fi,ti); segment = r.stops.slice(a,b+1); }
    return {...r, score, segment};
  }).filter(r=>r.score>0).sort((a,b)=>b.score-a.score).slice(0,6);
  state.transportResults = results;
  render();
}
function renderBusResults(){
  const results = state.transportResults;
  if(!results) return "";
  if(!results.length) return `<div class="hint" style="margin-top:12px;text-align:center;">No direct bus found for that search — try a nearby landmark or a single locality name.</div>`;
  return `<div style="margin-top:14px;">
    ${results.map(r=>{
      const segKm = r.km * (r.segment.length-1) / Math.max(1, r.stops.length-1);
      const fare = estimateFare(segKm || r.km, r.type);
      return `<div class="jam-card" style="align-items:flex-start;">
        <span class="jam-dot" style="background:${transportModeColor(r.type)};margin-top:4px;"></span>
        <div style="flex:1;">
          <div style="font-weight:700;font-size:13px;">${transportModeLabel(r.type)}${r.code?" "+r.code:""} · ${r.name}</div>
          <div class="hint" style="margin:3px 0;">${r.segment.join(" → ")}</div>
          <div class="hint">~${segKm.toFixed(1)} km · approx fare <b style="color:var(--ink);">₹${fare}</b>${r.type!=="gsrtc"?` · next in ${busEtaFor(r.id)} min`:` · ${r.freq}`}</div>
        </div>
      </div>`;
    }).join("")}
    <div class="hint" style="margin-top:6px;">Fares are indicative — please confirm the exact fare with the conductor or on the ticket counter.</div>
  </div>`;
}
function routeRow(r){
  const isLive = r.type!=="gsrtc";
  return `<div class="row">
    <div class="ic" style="background:${r.type==='brts'?'#FFE1EC':r.type==='bus'?'#E1F3FF':'#FDEEDF'};">
      <i data-lucide="${r.type==='brts'?'bus-front':'bus'}" style="width:16px;height:16px;color:${transportModeColor(r.type)};"></i>
    </div>
    <div class="info">
      <div class="t">${r.code?r.code+" · ":""}${r.name}</div>
      <div class="s">${r.stops[0]} → ${r.stops[r.stops.length-1]} · ${r.km} km ${isLive?`· ~₹${estimateFare(r.km,r.type)}`:`· ~₹${estimateFare(r.km,r.type)} · ${r.freq}`}</div>
    </div>
    ${isLive
      ? `<button class="pill-btn" onclick="refreshBusEta('${r.id}')" style="background:${transportModeColor(r.type)};">${busEtaFor(r.id)} min</button>`
      : `<span class="pill-btn" style="background:#FDEEDF;color:var(--orange);">Scheduled</span>`}
  </div>`;
}

function reportOutage(id){
  const u=state.utilities.find(x=>x.id===id);
  if(!u) return;
  u.status="Reported · checking";
  render();
}
const UTILITY_BILLS={
  1:{label:"Electricity Bill",icon:"zap",accent:"var(--sky)",provider:"Electricity provider"},
  2:{label:"Water Bill",icon:"droplet",accent:"var(--sky)",provider:"Surat Municipal Corporation"},
  3:{label:"Gas / LPG Bill",icon:"flame",accent:"var(--orange)",provider:"Gas provider"},
  4:{label:"Internet Bill",icon:"wifi",accent:"var(--purple)",provider:"Internet service provider"}
};
function openUtilityPayment(id){
  const u=state.utilities.find(x=>x.id===id), m=UTILITY_BILLS[id]||UTILITY_BILLS[1];
  state.utilityPayment={id,service:u?.name||m.label,account:"",amount:"",method:"UPI",reference:"",paid:false};
  render();
}
function closeUtilityPayment(){state.utilityPayment=null;render();}
function submitUtilityPayment(){
  const p=state.utilityPayment;
  if(!p) return;
  const account=(document.getElementById("utilityAccount")?.value||"").trim();
  const amount=Number(document.getElementById("utilityAmount")?.value||0);
  const method=document.getElementById("utilityMethod")?.value||"UPI";
  if(!account || !(amount>0)){alert("Please enter the consumer/account number and bill amount.");return;}
  const ref="SCP-PAY-"+Date.now().toString().slice(-8);
  const rec={service:p.service,account,amount,method,reference:ref,created:new Date().toISOString(),status:"Paid"};
  state.utilityPayments=state.utilityPayments||[];
  state.utilityPayments.unshift(rec);
  lsSet("scp_utility_payments",state.utilityPayments);
  state.utilityPayment={...p,account,amount:String(amount),method,reference:ref,paid:true};
  render();
}

const SOS_CATS = [
  {id:"accident", label:"Accident",           icon:"car"},
  {id:"crime",    label:"Crime in progress",  icon:"siren"},
  {id:"theft",    label:"Theft / robbery",    icon:"wallet"},

];
function sosCatMeta(id){ return SOS_CATS.find(c=>c.id===id); }
function selectSosCategory(id){ state.emergency.category = id; render(); }

/* Optional photo for an SOS report — same compress-then-stash approach as the maintenance photo
   upload, kept in its own variable so the two features never interfere with each other. */
let pendingSosPhoto = null;
function handleSosPhoto(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  if(!file.type.startsWith("image/")) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      let {width, height} = img;
      if(width>height && width>REPORT_PHOTO_MAX_DIM){ height=Math.round(height*REPORT_PHOTO_MAX_DIM/width); width=REPORT_PHOTO_MAX_DIM; }
      else if(height>=width && height>REPORT_PHOTO_MAX_DIM){ width=Math.round(width*REPORT_PHOTO_MAX_DIM/height); height=REPORT_PHOTO_MAX_DIM; }
      const canvas = document.createElement("canvas");
      canvas.width=width; canvas.height=height;
      canvas.getContext("2d").drawImage(img,0,0,width,height);
      pendingSosPhoto = canvas.toDataURL("image/jpeg", 0.62);
      render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function removeSosPhoto(){
  pendingSosPhoto=null;
  const inp=document.getElementById("sosPhotoInput"); if(inp) inp.value="";
  render();
}
async function getLiveFix(){
  if(!navigator.geolocation) return {lat:null,lng:null,label:"Location unavailable"};
  try{
    const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:10000}));
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    const label = await reverseGeo(lat,lng);
    return {lat,lng,label};
  }catch(e){ return {lat:null,lng:null,label:"Location unavailable — allow location access"}; }
}
function flashSosSent(){
  const em = state.emergency;
  em.sentFlash = true; render();
  setTimeout(()=>{ em.sentFlash=false; if(state.view==="emergency") render(); }, 4000);
}
async function sendImmediateSOS(){
  const em = state.emergency;
  em.sending = true; render();
  const fix = await getLiveFix();
  em.history.unshift({id:Date.now(), category:"immediate", label:"Immediate SOS", desc:"", loc:fix.label, lat:fix.lat, lng:fix.lng, time:new Date().toLocaleString()});
  em.sending = false;
  render();
  flashSosSent();
}
async function submitSosReport(){
  const em = state.emergency;
  const desc = (document.getElementById("sosDesc")?.value||"").trim();
  const locTyped = (document.getElementById("sosLoc")?.value||"").trim();
  em.sending = true; render();
  let loc = locTyped, lat=null, lng=null;
  if(!locTyped){ const fix = await getLiveFix(); loc = fix.label; lat=fix.lat; lng=fix.lng; }
  const cat = sosCatMeta(em.category);
  em.history.unshift({id:Date.now(), category:em.category, label:cat?cat.label:"Other", desc, loc:loc||"Not specified", lat, lng, time:new Date().toLocaleString(), photo:pendingSosPhoto||null});
  em.sending = false;
  em.category = null;
  pendingSosPhoto = null;
  render();
  flashSosSent();
}
/* ---- Civic advisory / notification panel ---- */
const CIVIC_ALERT_FEEDS = [
  // Add an authorised Surat Municipal Corporation / IMD / verified news-agency JSON endpoint
  // here — shaped as [{title, body, area, severity, source, time}, ...] — and it is polled
  // automatically. Until one is configured, the seeded advisory list below is shown.
];
let civicAlertTimer = null;
async function refreshCivicAlerts(){
  for(const url of CIVIC_ALERT_FEEDS){
    try{
      const res = await fetch(url);
      if(!res.ok) continue;
      const data = await res.json();
      if(Array.isArray(data) && data.length){
        state.civicAlerts = data.map((d,i)=>({
          id:d.id!=null?d.id:("live"+i+"_"+Date.now()), title:d.title, body:d.body,
          area:d.area||"Surat", severity:d.severity||"Advisory", source:d.source||"Official feed",
          time:d.time||new Date().toLocaleString(), live:true,
        }));
        state.civicSource = "live";
        state.civicUpdated = new Date();
        if(state.view==="emergency") render();
        return;
      }
    }catch(e){}
  }
  if(!state.civicUpdated) state.civicUpdated = new Date();
}
function startCivicAlertPolling(){
  refreshCivicAlerts();
  clearInterval(civicAlertTimer);
  civicAlertTimer = setInterval(refreshCivicAlerts, 5*60*1000);
}
function dismissCivicAlert(id){ state.civicAlerts = state.civicAlerts.filter(a=>a.id!==id); render(); }
function clearCivicAlerts(){ state.civicAlerts = []; render(); }
function civicSeverityColor(s){ return s==="Severe"?"var(--red)": s==="Warning"?"var(--sun)":"var(--sky)"; }
function civicIcon(title){
  const t=(title||"").toLowerCase();
  if(t.includes("rain")||t.includes("flood")||t.includes("water")) return "cloud-rain";
  if(t.includes("heat")) return "thermometer-sun";
  if(t.includes("wind")||t.includes("storm")||t.includes("cyclone")) return "wind";
  if(t.includes("power")||t.includes("electric")) return "zap";
  return "megaphone";
}

/* ---------------- Signal turn illustrations ---------------- */
function turnSvg(type,color){
  const paths = {
    straight:`<path d="M100 170 L100 30" stroke="${color}" stroke-width="6" fill="none" marker-end="url(#rm)"/>`,
    left:`<path d="M100 170 L100 90 L40 90" stroke="${color}" stroke-width="6" fill="none" marker-end="url(#rm)"/>`,
    right:`<path d="M100 170 L100 90 L160 90" stroke="${color}" stroke-width="6" fill="none" marker-end="url(#rm)"/>`,
  };
  return `<svg viewBox="0 0 200 200" style="width:100%;max-width:120px;display:block;margin:0 auto;">
    <rect x="0" y="80" width="200" height="40" fill="#EDEAFB"/><rect x="80" y="0" width="40" height="200" fill="#EDEAFB"/>
    ${paths[type]}
    <defs><marker id="rm" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${color}"/></marker></defs>
  </svg>`;
}

function render(){
  renderNav();
  const el = document.getElementById("main");
  const views = {
    dashboard: viewDashboard, map: viewMap, traffic: viewTraffic, maintenance: viewMaintenance,
    government: viewGovernment, health: viewHealth, transport: viewTransport, utilities: viewUtilities,
    suggestions: viewSuggestions, emergency: viewEmergency, route: viewRoute, help: viewHelp,
  };
  const offline = !navigator.onLine ? `<div class="offline-banner"><i data-lucide="wifi-off" style="width:14px;height:14px;"></i>You're offline — showing your last saved data. Changes will sync once you're back online.</div>` : "";
  destroyMaps(); destroyGlobe();
  el.innerHTML = offline + sectionHero() + (views[state.view]||viewDashboard)() + `<div class="footer-note">Surat Smart City Portal · live maps by OpenStreetMap, Esri imagery &amp; citizen reports</div>`;
  if(state.view==="maintenance") renderMaintenanceList();
  safeIcons();
  if(state.view==="traffic"){ startSigTimers(); drawTrafficMap(); if(state.traffic.routeOptions.length) startRouteSigTimers(); }
  if(state.view==="map" && state.mapMode==="live") drawCityMap();
  if(state.view==="map" && state.mapMode==="globe") initGlobe();
}

/* ---------------- Boot / hydrate from backend ---------------- */
async function init(){
  render(); // paint instantly with defaults so the app feels fast even on slow connections
  window.addEventListener("online", ()=>{ setSync("synced"); render(); });
  window.addEventListener("offline", ()=>{ setSync("offline"); render(); });
  startCivicAlertPolling(); // keep pulling municipal / IMD / news safety advisories in the background

  state.baseKind = lsGet("scp_base", "street") || "street";
  state.reviews = lsGet("scp_reviews", []) || [];

  // stay signed in: the saved session is restored instantly on every visit
  const cached = lsGet("scp_session", null);
  if(cached){ state.auth.user = cached; render(); }

  const savedDS = await apiGet("scp_datasaver", false);
  if(savedDS!==null) state.dataSaver = savedDS;

  const session = cached || await apiGet("scp_session", false);
  if(session){
    state.auth.user = session;
    if(!cached) lsSet("scp_session", session);
    const myReports = lsGet("scp_reports_"+session.email, null) || await apiGet(`scp_reports_${session.email}`, false);
    if(myReports) state.maintenance = myReports;
    const myGovApps = lsGet("scp_gov_"+session.email, null) || await apiGet(`scp_gov_${session.email}`, false);
    if(myGovApps) state.gov.applications = myGovApps;
  }
  await loadSuggestions();
  await loadWorkers();
  render();
}

async function loadWorkers(){
  const w = await apiGet("scp_workers", true);
  state.workers.list = (w && w.length) ? w : (lsGet("scp_workers", []) || []);
}
function pickWorkerCat(id){ state.workers.cat=id; render(); }
function renderWorkerList(){
  const w = state.workers;
  const kw = (w.search||"").toLowerCase().trim();
  let list = (w.list||[]).concat(SEED_WORKERS);
  if(w.cat!=='all') list = list.filter(x=>x.cat===w.cat);
  if(kw) list = list.filter(x=> x.name.toLowerCase().includes(kw) || x.area.toLowerCase().includes(kw));
  if(!list.length) return `<div class="hint" style="text-align:center;padding:14px 0;">No matching service providers yet — be the first to register below!</div>`;
  return list.map(x=>workerRow(x)).join("");
}
function filterWorkers(v){
  state.workers.search = v;
  const box = document.getElementById("workerResults");
  if(box){ box.innerHTML = renderWorkerList(); safeIcons(); }
}
function openWorkerChat(w){
  state.workerChat={worker:w,messages:[{from:"worker",text:`Hi! I’m ${w.name}. What service do you need?`}]};
  render();
}
function closeWorkerChat(){state.workerChat=null;render();}
function sendWorkerChat(){
  const c=state.workerChat;if(!c)return;
  const input=document.getElementById("workerChatInput");const text=(input?.value||"").trim();if(!text)return;
  c.messages.push({from:"user",text});
  c.messages.push({from:"worker",text:"Thanks! I’ve received your message. In the production version, the worker will reply here in real time."});
  render();
}

async function submitWorkerRegistration(){
  if(!requireAuth()) return;
  const w = state.workers;
  const name = (document.getElementById("wName")?.value||"").trim();
  const cat = document.getElementById("wCat")?.value || "plumber";
  const phone = (document.getElementById("wPhone")?.value||"").trim();
  const area = (document.getElementById("wArea")?.value||"").trim();
  const years = (document.getElementById("wYears")?.value||"").trim();
  const rate = (document.getElementById("wRate")?.value||"").trim();
  const bio = (document.getElementById("wBio")?.value||"").trim();
  w.formErr=""; w.formMsg="";
  if(!name || !area){ w.formErr="Please enter your name and the area you serve."; render(); return; }
  if(!/^[6-9]\d{9}$/.test(phone)){ w.formErr="Please enter a valid 10-digit mobile number."; render(); return; }
  const item = {id:"u"+Date.now(), name, cat, phone, area, years: years?Number(years):null, rate, bio,
                by: state.auth.user.email, when:new Date().toLocaleString(), sample:false};
  w.list.unshift(item);
  w.formMsg = "You're listed! Residents searching your trade can now find and call you.";
  render();
  lsSet("scp_workers", w.list);
  await apiSet("scp_workers", w.list, true);
  setTimeout(()=>{ w.formMsg=""; if(state.view==="workers") render(); }, 3500);
}

function etaFromCode(code){return 3+(hashNum(code+Math.floor(Date.now()/60000))%18);}
function wx(code){return code===0?'☀️':code<=2?'🌤️':code===3?'☁️':code<=48?'🌫️':code<=67?'🌧️':code<=77?'🌨️':code<=82?'🌦️':'⛈️';}
function wxName(code){return code===0?'Clear sky':code<=2?'Partly cloudy':code===3?'Overcast':code<=48?'Foggy':code<=67?'Rain':code<=77?'Snow':code<=82?'Showers':'Thunderstorm';}
function aqName(a){return a<=50?'Good':a<=100?'Moderate':a<=200?'Poor':'Very poor';}
function aqClass(a){return a<=50?'aqi-good':a<=100?'aqi-moderate':a<=200?'aqi-poor':'aqi-bad';}

async function loadLiveWeather(){
 try{
  state.weather.busy=true;
  const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${SURAT.lat}&longitude=${SURAT.lng}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&forecast_days=1&timezone=Asia%2FKolkata`).then(r=>r.json());
  const a=await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${SURAT.lat}&longitude=${SURAT.lng}&current=us_aqi,pm2_5,pm10&timezone=Asia%2FKolkata`).then(r=>r.json());
  state.weather.current={...w.current,aqi:a.current.us_aqi,pm25:a.current.pm2_5,pm10:a.current.pm10};
  state.weather.hours=(w.hourly.time||[]).slice(0,7).map((t,i)=>({time:t,temp:w.hourly.temperature_2m[i],rain:w.hourly.precipitation_probability[i],code:w.hourly.weather_code[i]}));
  state.weather.updated=new Date();
 }catch(e){} finally{state.weather.busy=false;}
 if(state.view==='dashboard') render();
}

/* Actual 3D Surat: satellite imagery underneath + OSM building extrusions + names/landmarks. */
function initCity3D(){
 if(typeof maplibregl==='undefined'||!document.getElementById('city3dMap'))return;
 destroy3D();
 const p=state.cityPlace||SURAT;
 const map=new maplibregl.Map({container:'city3dMap',style:'https://tiles.openfreemap.org/styles/bright',center:[p.lng,p.lat],zoom:state.cityPlace?15.2:12.6,pitch:62,bearing:-12,antialias:true});
 window.__smartCityMap=map;
 map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
 map.addControl(new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true},trackUserLocation:true}),'top-right');
 map.on('load',()=>{
  try{
   map.addSource('satellite',{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19,attribution:'Esri World Imagery'});
   const first=map.getStyle().layers[0]?.id;
   map.addLayer({id:'satellite-base',type:'raster',source:'satellite',paint:{'raster-opacity':.86}},first);
  }catch(e){}
  try{
   if(!map.getSource('surat-buildings')) map.addSource('surat-buildings',{type:'vector',url:'https://tiles.openfreemap.org/planet'});
   if(!map.getLayer('surat-building-3d')) map.addLayer({id:'surat-building-3d',type:'fill-extrusion',source:'surat-buildings','source-layer':'building',minzoom:13,paint:{'fill-extrusion-color':'#b9c8d9','fill-extrusion-height':['coalesce',['to-number',['get','render_height']],['*',['coalesce',['to-number',['get','levels']],1],3.2],4],'fill-extrusion-base':['coalesce',['to-number',['get','render_min_height']],0],'fill-extrusion-opacity':.82}});
  }catch(e){}
  addCityLandmarks3D(map);
 });
}
async function addCityLandmarks3D(map){
 const queries=['Surat Railway Station Surat','Surat Municipal Corporation Surat','Surat Airport','VR Mall Surat','Dumas Beach','Science Centre Surat','Dutch Garden Surat','SMIMER Hospital Surat'];
 const points=[];
 for(const q of queries){try{const r=await geoSearch(q,SURAT); if(r[0]) points.push(r[0]);}catch(e){}}
 points.forEach(p=>new maplibregl.Marker({color:'#f4b72b'}).setLngLat([p.lng,p.lat]).setPopup(new maplibregl.Popup({offset:12}).setHTML(`<b>${escHtml(p.name||p.label||'Landmark')}</b><br><span style="font-size:11px">${escHtml(p.label||'Surat')}</span>`)).addTo(map));
}

/* MapLibre vector globe: MapLibre GL -> OpenFreeMap vector tiles -> globe projection. */
function destroyGlobe(){
  try{ if(window.__smartGlobe){ window.__smartGlobe.remove(); } }catch(e){}
  window.__smartGlobe=null;
}

function initGlobe(){
  const el=document.getElementById('globeMap');
  if(!el || typeof maplibregl==='undefined') return;
  destroyGlobe();
  const map=new maplibregl.Map({
    container:'globeMap',
    style:'https://tiles.openfreemap.org/styles/bright',
    center:[72.8311,21.1702],
    zoom:2.6,
    minZoom:1,
    maxZoom:18,
    pitch:0,
    bearing:0,
    antialias:true
  });
  window.__smartGlobe=map;
  map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
  try{ map.addControl(new maplibregl.GlobeControl(),'top-right'); }catch(e){}

  map.on('style.load',()=>{
    try{ map.setProjection({type:'globe'}); }catch(e){}
    try{
      map.setFog({
        color:'rgb(186, 210, 235)',
        'high-color':'rgb(36, 76, 125)',
        'horizon-blend':0.18,
        'space-color':'rgb(5, 14, 28)',
        'star-intensity':0.55
      });
    }catch(e){}

    // Keep Surat visible as the primary smart-city marker without replacing the vector map.
    try{
      new maplibregl.Marker({color:'#E0447A'})
        .setLngLat([SURAT.lng,SURAT.lat])
        .setPopup(new maplibregl.Popup({offset:18}).setHTML('<b>Surat</b><br>Gujarat, India'))
        .addTo(map);
    }catch(e){}
  });
}

async function findGlobe(){
  const q=(document.getElementById('globeSearch')?.value||'').trim();
  if(!q||!window.__smartGlobe) return;
  state.globeSearch.q=q;
  state.globeSearch.busy=true;
  state.globeSearch.error='';
  render();
  try{
    state.globeSearch.results=(await globalGeoSearch(q)).slice(0,6);
    if(!state.globeSearch.results.length) state.globeSearch.error='No matching place found.';
  }catch(e){
    state.globeSearch.results=[];
    state.globeSearch.error='Global place search is unavailable right now.';
  }
  state.globeSearch.busy=false;
  render();
}

function flyGlobe(i){
  const r=state.globeSearch.results?.[i];
  const map=window.__smartGlobe;
  if(!r || !map) return;
  map.flyTo({center:[r.lng,r.lat],zoom:10.5,duration:1800,essential:true});
  try{
    new maplibregl.Popup({closeButton:true,offset:16})
      .setLngLat([r.lng,r.lat])
      .setHTML(`<b>${escHtml(r.name||r.label)}</b><br><span style="font-size:11px">${escHtml(r.label||'')}</span>`)
      .addTo(map);
  }catch(e){}
  state.globeSearch.results=[];
  render();
}

function closeAppointment(){state.appointment=null;render();}
function submitAppointment(){const h=state.appointment;const data={hospital:h.name,name:document.getElementById('apName')?.value||'',phone:document.getElementById('apPhone')?.value||'',date:document.getElementById('apDate')?.value||'',time:document.getElementById('apTime')?.value||'',reason:document.getElementById('apReason')?.value||'',created:new Date().toISOString()};if(!data.name||!data.phone||!data.date){alert('Enter name, mobile number and preferred date.');return;}const a=lsGet('scp_appointments',[])||[];a.unshift(data);lsSet('scp_appointments',a);window.open(h.booking||BOOKING_URLS.railway,'_blank','noopener');closeAppointment();}

function bookingModal(){const b=state.ticketBooking;if(!b)return '';const isRail=b.type==='railway';const isGs=b.type==='gsrtc';const title=isRail?'Book train ticket':isGs?'Book GSRTC ticket':'Book Sitilink ticket';const url=isRail?BOOKING_URLS.railway:isGs?BOOKING_URLS.gsrtc:BOOKING_URLS.sitilink;return `<div class="appointment-modal" onclick="if(event.target===this)closeTicketBooking()"><div class="appointment-box"><div style="display:flex;justify-content:space-between;align-items:start"><div><b style="font-size:16px">${title}</b><div class="hint">${escHtml(b.label||'')}</div></div><button class="btn ghost" onclick="closeTicketBooking()">Close</button></div><div class="appointment-grid" style="margin-top:12px"><input class="field" id="tbFrom" placeholder="From" value="${escAttr(b.from||'')}"><input class="field" id="tbTo" placeholder="To" value="${escAttr(b.to||'')}"><input class="field" id="tbDate" type="date" min="${new Date().toISOString().slice(0,10)}"><input class="field" id="tbTime" type="time" value="${escAttr(b.time||'09:00')}"></div>${isRail?`<input class="field" id="tbStation" placeholder="Boarding station" value="${escAttr(b.station||state.railwayStation)}" style="margin-top:10px">`:''}<div class="appointment-note">This portal captures your preferred place/date/time and then transfers you to the official operator booking system for fare, seat and live availability.</div><button class="btn wide" style="background:${isRail?'var(--purple)':isGs?'var(--orange)':'var(--pink)'};margin-top:10px" onclick="submitTicketBooking()">Continue to official booking</button><a class="btn wide ghost" style="margin-top:8px;text-decoration:none;justify-content:center" href="${url}" target="_blank" rel="noopener">Open official booking now</a></div></div>`;}
function openTicketBooking(type,label,station){state.ticketBooking={type,label,station:station||'',from:'',to:'',time:'09:00'};render();}
function closeTicketBooking(){state.ticketBooking=null;render();}
function submitTicketBooking(){const b=state.ticketBooking;const data={type:b.type,label:b.label,station:document.getElementById('tbStation')?.value||b.station||'',from:document.getElementById('tbFrom')?.value||'',to:document.getElementById('tbTo')?.value||'',date:document.getElementById('tbDate')?.value||'',time:document.getElementById('tbTime')?.value||'',created:new Date().toISOString()};if(!data.date){alert('Please select a travel date.');return;}const arr=lsGet('scp_ticket_bookings',[])||[];arr.unshift(data);lsSet('scp_ticket_bookings',arr);const url=b.type==='railway'?BOOKING_URLS.railway:b.type==='gsrtc'?BOOKING_URLS.gsrtc:BOOKING_URLS.sitilink;window.open(url,'_blank','noopener');closeTicketBooking();}

function busRows(items,type){return items.map(r=>`<div class="row"><div class="ic" style="background:${type==='brts'?'#FFE7EF':type==='city'?'#E4F4FF':'#FDEEDF'}"><b style="font-size:12px;color:${type==='brts'?'var(--pink)':type==='city'?'var(--sky)':'var(--orange)'}">${escHtml(r.code)}</b></div><div class="info"><div class="t">${type==='brts'?'BRT':'City'} ${escHtml(r.code)} · ${escHtml(r.from)} → ${escHtml(r.to)}</div><div class="s">Approx. next arrival · ${etaFromCode(r.code)} min · official service number</div></div><span class="pill-btn" style="background:${type==='brts'?'var(--pink)':type==='city'?'var(--sky)':'var(--orange)'}">~${etaFromCode(r.code)} min</span><button class="pill-btn" style="background:#eef5ff;color:var(--ink)" onclick="openTicketBooking('${type==='brts'?'sitilink':'gsrtc'}','${jsAttr((type==='brts'?'BRT ':'City ') + r.code)}')">Book</button></div>`).join('');}
function setTransportTab(t){state.transportTab=t;render();}

/* ---------------- Expanded Railways / GSRTC controls ---------------- */
if(!state.transportTracker) state.transportTracker=null;

const GSRTC_SCHEDULES=[
 {id:"gs1",service:"GSRTC Express",from:"Surat Central Bus Stand",to:"Ahmedabad Gita Mandir",depart:"06:30",arrive:"12:00",duration:"5h 30m"},
 {id:"gs2",service:"GSRTC Express",from:"Surat Central Bus Stand",to:"Vadodara Central Bus Stand",depart:"07:15",arrive:"10:45",duration:"3h 30m"},
 {id:"gs3",service:"GSRTC Sleeper / Volvo",from:"Surat Central Bus Stand",to:"Mumbai Central",depart:"21:30",arrive:"03:45",duration:"6h 15m"},
 {id:"gs4",service:"GSRTC Express",from:"Surat Central Bus Stand",to:"Bharuch",depart:"09:00",arrive:"10:35",duration:"1h 35m"}
];
function openTransportTracker(type,label,ref){state.transportTracker={type,label,ref,progress:42};render();}
function closeTransportTracker(){state.transportTracker=null;render();}
function refreshTransportTracker(){if(!state.transportTracker)return;state.transportTracker.progress=Math.min(95,state.transportTracker.progress+7);render();}
function trackTrainPrompt(){
 const n=(document.getElementById("railTrackNo")?.value||"").trim();
 if(!n){alert("Enter a train number.");return;}
 openTransportTracker("railway","Train "+n,n);
}
function trackPNRPrompt(){
 const n=(document.getElementById("railPNR")?.value||"").trim();
 if(!n){alert("Enter your PNR.");return;}
 openTransportTracker("pnr","PNR "+n,n);
}
function renderTransportTracker(){
 const t=state.transportTracker, rail=t.type==="railway"||t.type==="pnr";
 const color=rail?"var(--purple)":"var(--orange)";
 return `<div class="appointment-modal" onclick="if(event.target===this)closeTransportTracker()"><div class="appointment-box">
  <div style="display:flex;justify-content:space-between;align-items:start"><div><b style="font-size:16px">${rail?"Rail tracking":"GSRTC tracking"}</b><div class="hint">${escHtml(t.label)}</div></div><button class="btn ghost" onclick="closeTransportTracker()">Close</button></div>
  <div class="card" style="margin-top:12px"><div class="hint">Tracking reference</div><div style="font-size:18px;font-weight:800">${escHtml(t.ref)}</div>
  <div style="height:10px;border-radius:20px;background:#e9eef6;overflow:hidden;margin-top:12px"><div style="height:100%;width:${t.progress}%;background:${color}"></div></div>
  <div class="hint" style="margin-top:7px">${t.progress}% journey progress · ${t.progress<90?"In transit":"Approaching destination"}</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
    <button class="btn" style="background:${color}" onclick="refreshTransportTracker()">Refresh</button>
    ${rail
      ? `<a class="btn ghost" style="text-decoration:none" href="https://www.indianrail.gov.in/enquiry/PNR/PnrEnquiry.html?locale=en" target="_blank" rel="noopener">Official PNR / train status</a>`
      : `<a class="btn ghost" style="text-decoration:none" href="https://www.gsrtc.in/vehcleStatus/" target="_blank" rel="noopener">Official GSRTC live tracking</a>`}
  </div>
 </div></div>`;
}
function viewGsrtcExpanded(){
 return `<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
   <div><h2 style="color:var(--orange);margin-bottom:3px">GSRTC schedules</h2><div class="hint">See departures, track services and continue to official booking.</div></div>
   <button class="btn" style="background:var(--orange)" onclick="openTicketBooking('gsrtc','GSRTC ticket')">Book GSRTC ticket</button>
  </div>
  <div class="appointment-grid" style="margin-top:12px"><input class="field" id="gsFrom" value="Surat Central Bus Stand" placeholder="From"><input class="field" id="gsTo" placeholder="To"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
   <a class="btn ghost" style="text-decoration:none" href="${BOOKING_URLS.gsrtc}" target="_blank" rel="noopener">Official booking</a>
   <a class="btn ghost" style="text-decoration:none" href="https://www.gsrtc.in/vehcleStatus/" target="_blank" rel="noopener">Official live tracking</a>
  </div>
 </div>
 <div class="card"><h2 style="color:var(--orange);display:flex;align-items:center;gap:7px"><i data-lucide="clock-3" style="width:16px;height:16px"></i>Sample Surat departures</h2>
 ${GSRTC_SCHEDULES.map(r=>`<div class="row"><div class="ic" style="background:#FDEEDF"><i data-lucide="bus-front" style="width:16px;height:16px;color:var(--orange)"></i></div>
 <div class="info"><div class="t">${escHtml(r.service)} · ${escHtml(r.from)} → ${escHtml(r.to)}</div><div class="s">Departs ${r.depart} · Arrives ${r.arrive} · ${r.duration}</div></div>
 <button class="pill-btn" style="background:#FDEEDF;color:var(--orange)" onclick="openTransportTracker('gsrtc',${jsAttr(r.service+' · '+r.to)},${jsAttr(r.id)})">Track</button>
 <button class="pill-btn" style="background:var(--orange)" onclick="openTicketBooking('gsrtc',${jsAttr(r.service+' · '+r.to)})">Book</button></div>`).join("")}
 </div>
 ${state.transportTracker?renderTransportTracker():""}`;
}

function viewRailwayExpanded(){
 const station=state.railwayStation;
 const rows=RAIL_TIMETABLE[station]||[];
 return `<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h2 style="color:var(--purple);margin-bottom:3px">Railways</h2><div class="hint">Timetable snapshots, live tracking and ticket booking.</div></div>
  <button class="btn" style="background:var(--purple)" onclick="openTicketBooking('railway','IRCTC train booking',${jsAttr(station)})">Book train ticket</button></div>
  <div class="chiprow" style="margin-top:12px">${RAIL_STATIONS.map(s=>`<button class="chip ${s===station?'active':''}" onclick="setRailStation(${jsAttr(s)})">${escHtml(s)}</button>`).join("")}</div>
 </div>
 <div class="card"><h2 style="color:var(--purple)">${escHtml(station)} timetable</h2>
 ${rows.map(r=>`<div class="row"><div class="ic" style="background:#F0E9FF"><b style="color:var(--purple);font-size:11px">${escHtml(r[0])}</b></div><div class="info"><div class="t">${escHtml(r[1])}</div><div class="s">${escHtml(r[2])} · ${escHtml(r[3])}</div></div>
 <button class="pill-btn" style="background:#F0E9FF;color:var(--purple)" onclick="openTransportTracker('railway',${jsAttr(r[0]+' · '+r[1])},${jsAttr(r[0])})">Track</button>
 <button class="pill-btn" style="background:var(--purple)" onclick="openTicketBooking('railway',${jsAttr(r[0]+' · '+r[1])},${jsAttr(station)})">Book</button></div>`).join("")}
 </div>
 <div class="card"><h2>Track a train or PNR</h2><div class="appointment-grid" style="margin-top:10px">
  <input class="field" id="railTrackNo" placeholder="Train number, e.g. 12922"><button class="btn" style="background:var(--purple)" onclick="trackTrainPrompt()">Track train</button>
  <input class="field" id="railPNR" placeholder="PNR number"><button class="btn ghost" onclick="trackPNRPrompt()">Track PNR</button>
 </div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
  <a class="btn ghost" style="text-decoration:none" href="https://www.indianrail.gov.in/enquiry/SCHEDULE/TrainSchedule.html?locale=en%2F" target="_blank" rel="noopener">Official schedule</a>
  <a class="btn ghost" style="text-decoration:none" href="https://www.irctc.co.in/nget/train-search" target="_blank" rel="noopener">Official booking</a>
 </div></div>
 ${state.transportTracker?renderTransportTracker():""}`;
}

function viewTransport(){
  const modes=[
    {id:'brts',label:'BRTS',icon:'bus-front'},
    {id:'bus',label:'City Bus',icon:'bus'},
    {id:'gsrtc',label:'GSRTC',icon:'map'},
    {id:'railway',label:'Railways',icon:'train-front'},
    {id:'metro',label:'Metro',icon:'train-front'}
  ];
  return `<div class="map-toggle">${modes.map(m=>`<button class="${state.transportMode===m.id?'active':''}" onclick="setTransportMode('${m.id}')"><i data-lucide="${m.icon}" style="width:14px;height:14px;"></i>${m.label}</button>`).join('')}</div>
  ${state.transportMode==='railway'?viewRailwayExpanded():
    state.transportMode==='gsrtc'?viewGsrtcExpanded():
    state.transportMode==='metro'?viewMetroComingSoon():
    `<div class="card">
      <h2 style="display:flex;align-items:center;gap:7px;color:${transportModeColor(state.transportMode)};"><i data-lucide="search" style="width:16px;height:16px;"></i>Find the right bus</h2>
      <p class="hint" style="margin:0 0 12px;">Search BRTS and City Bus routes across Surat by locality or landmark.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <input class="field" id="busFrom" placeholder="From (optional) — e.g. Adajan" style="flex:1;min-width:150px;margin-bottom:0;" value="${escAttr(state.transportSearch.from)}"/>
        <input class="field" id="busTo" placeholder="To — e.g. Railway Station" style="flex:1;min-width:150px;margin-bottom:0;" value="${escAttr(state.transportSearch.to)}"/>
      </div>
      <button class="btn wide" style="margin-top:10px;background:${transportModeColor(state.transportMode)};" onclick="searchBusRoutes()"><i data-lucide="search" style="width:14px;height:14px;"></i>Search routes</button>
      ${renderBusResults()}
    </div>
    <div class="card"><h2 style="display:flex;align-items:center;gap:7px;color:${transportModeColor(state.transportMode)};"><i data-lucide="bus" style="width:16px;height:16px;"></i>${transportModeLabel(state.transportMode)} routes</h2>
      ${BUS_ROUTES.filter(r=>r.type===state.transportMode).map(r=>routeRow(r)).join('')}
    </div>`}`;
}


function viewRailwayCore(){const station=state.railwayStation;const rows=RAIL_TIMETABLE[station]||[];return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h2 style="color:var(--purple);margin-bottom:3px">Surat railway network</h2><div class="hint">Stations around Surat city with timetable snapshots and direct IRCTC booking.</div></div><button class="btn" style="background:var(--purple)" onclick="openTicketBooking('railway','IRCTC train booking', ${jsAttr(station)})">Book train ticket</button></div><div class="chiprow" style="margin-top:12px">${RAIL_STATIONS.map(s=>`<button class="chip ${s===station?'active':''}" onclick="setRailStation('${jsAttr(s)}')">${escHtml(s)}</button>`).join('')}</div></div><div class="card"><h2 style="color:var(--purple)">${escHtml(station)} timetable</h2>${rows.length?rows.map(r=>`<div class="row"><div class="ic" style="background:#F0E9FF"><b style="color:var(--purple);font-size:11px">${r[0]}</b></div><div class="info"><div class="t">${escHtml(r[1])}</div><div class="s">${r[2]} · ${r[3]} · timetable snapshot</div></div><button class="pill-btn" style="background:var(--purple)" onclick="openTicketBooking('railway',${jsAttr(r[0]+' · '+r[1])},${jsAttr(station)})">Book</button></div>`).join(''):`<div class="hint">No local snapshot is embedded for this station yet. Use IRCTC/NTES for the live station timetable.</div>`}</div><div class="card"><h2>Live railway search & ticketing</h2><p class="hint">Select your boarding station, date and preferred time; then continue to the official IRCTC search for current train availability.</p><button class="btn" style="background:var(--purple)" onclick="openTicketBooking('railway','IRCTC train search',${jsAttr(station)})">Search trains & book</button><a class="btn ghost" style="margin-left:8px;text-decoration:none" href="https://www.irctc.co.in/nget/train-search" target="_blank" rel="noopener">Open IRCTC</a></div>${bookingModal()}`;}
function setRailStation(s){state.railwayStation=s;render();}
function viewRailway(){return viewRailwayCore();}

/* Navigation: when the journey starts, keep zoomed tightly around the live GPS point. */
const __originalUpdateNavPosition=updateNavPosition;
updateNavPosition=function(lat,lng){__originalUpdateNavPosition(lat,lng);const map=LMAPS.trafficMap;if(map){try{map.setView([lat,lng],18,{animate:true,duration:.8})}catch(e){}}};

/* Final render: keep every portal section on the stable v8 routing path. */
function render(){
 renderNav();
 const el=document.getElementById('main');
 const views={dashboard:viewDashboard,map:viewMap,traffic:viewTraffic,maintenance:viewMaintenance,government:viewGovernment,health:viewHealth,transport:viewTransport,utilities:viewUtilities,workers:viewWorkers,suggestions:viewSuggestions,emergency:viewEmergency,route:viewRoute,help:viewHelp};
 const offline=!navigator.onLine?`<div class=\"offline-banner\"><i data-lucide=\"wifi-off\" style=\"width:14px;height:14px\"></i>You're offline — showing cached data.</div>`:'';
 destroyMaps();
 try{destroyGlobe()}catch(e){}
 el.innerHTML=offline+sectionHero()+(views[state.view]||viewDashboard)()+`<div class=\"footer-note\">Surat Smart City Portal · live maps by OpenStreetMap, Esri satellite imagery &amp; citizen services</div>`+renderWithdrawConfirmModal()+workerChatModal();
 if(state.view==='maintenance')renderMaintenanceList();
 safeIcons();
 if(state.view==='traffic'){startSigTimers();drawTrafficMap();if(state.traffic.routeOptions.length)startRouteSigTimers();}
 if(state.view==='map'&&state.mapMode==='live')drawCityMap();
 if(state.view==='map'&&state.mapMode==='city')setTimeout(initCity3D,40);
 if(state.view==='map'&&state.mapMode==='globe')setTimeout(initGlobe,40);
}

loadLiveWeather(); loadUrbanTrafficPulse(); setInterval(loadLiveWeather,600000); setInterval(loadUrbanTrafficPulse,300000);
init();
</script>
</body>
</html>
