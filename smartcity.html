  .fk{font-family:'Fredoka','Nunito',sans-serif;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;transition:transform .12s ease;}
  button:active{transform:scale(0.95);}

  .bubble{position:fixed;border-radius:50%;background:rgba(255,255,255,0.07);pointer-events:none;z-index:0;}

  header{
    position:sticky; top:0; z-index:40; backdrop-filter:blur(10px);
    background:rgba(43,35,96,0.35); border-bottom:1px solid rgba(255,255,255,0.15);
  }
  .nav-wrap{
    max-width:1180px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:10px;color:#fff;}
  .brand .logo{
    width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--sun),var(--orange));
    display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .brand span{font-weight:700;font-size:17px;}
  nav.links{display:flex;gap:6px;}
  nav.links button{
    color:rgba(255,255,255,0.85); font-weight:700; font-size:13.5px; padding:9px 14px; border-radius:12px;
    display:flex; align-items:center; gap:6px;
  }
  nav.links button.active{background:#fff;color:var(--ink);}
  .nav-right{display:flex;align-items:center;gap:10px;}
  .icon-btn{
    width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.18);color:#fff;
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .badge{
    position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--sun);
    font-size:9px;font-weight:800;color:var(--ink);display:flex;align-items:center;justify-content:center;
  }
  .hamb{display:none;}
  @media (max-width:860px){
    nav.links{display:none;}
    .hamb{display:flex;}
  }
  @media (max-width:480px){
    .sync-badge{display:none;}
    .nav-right{gap:6px;}
  }
  .mobile-menu{
    display:none; flex-direction:column; gap:4px; padding:10px 20px 16px; background:rgba(43,35,96,0.5);
  }
  .mobile-menu.open{display:flex;}
  .mobile-menu button{color:#fff;font-weight:700;font-size:13.5px;padding:10px 12px;border-radius:10px;text-align:left;display:flex;align-items:center;gap:8px;}
  .mobile-menu button.active{background:rgba(255,255,255,0.2);}

  .notif-panel{
    position:absolute; top:60px; right:24px; width:300px; max-width:calc(100vw - 32px);
    background:#fff; border-radius:18px; padding:14px; box-shadow:0 16px 40px rgba(43,35,96,0.35); z-index:50;
  }
  .notif-item{padding:9px 4px;border-bottom:1px solid #F2F0FF;font-size:12.5px;}
  .notif-item .t{font-weight:700;color:var(--ink);}
  .notif-item .s{font-size:10.5px;color:var(--muted);margin-top:2px;}

  main{max-width:1180px;margin:0 auto;padding:28px 24px 60px;position:relative;z-index:1;}

  .hero{
    background:rgba(255,255,255,0.95); border-radius:24px; padding:28px 30px; margin-bottom:26px;
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .hero h1{font-size:24px;margin:0 0 6px;font-weight:700;}
  .hero p{margin:0;color:var(--muted);font-size:13.5px;}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media (max-width:920px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:10px;}}
  .fcard{
    background:#fff;border-radius:20px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:10px;
  }
  .fcard .ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;}
  .fcard .name{font-weight:700;font-size:14.5px;}
  .fcard .sub{font-size:11.5px;color:var(--muted);}

  .card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;}
  .card h2{font-size:15px;margin:0 0 14px;font-weight:700;}
  .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #F2F0FF;}
  .row:last-child{border-bottom:none;}
  .row .ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .row .info{flex:1;}
  .row .info .t{font-weight:700;font-size:13px;}
  .row .info .s{font-size:11px;color:var(--muted);margin-top:2px;}
  .pill-btn{padding:8px 13px;border-radius:11px;font-weight:700;font-size:11px;color:#fff;display:flex;align-items:center;gap:5px;}

  .map-toggle{display:flex;gap:8px;margin-bottom:16px;max-width:420px;}
  .map-toggle button{flex:1;padding:11px;border-radius:14px;background:rgba(255,255,255,0.25);color:#fff;font-weight:700;font-size:13px;}
  .map-toggle button.active{background:#fff;color:var(--ink);}
  .city-box{background:rgba(255,255,255,0.95);border-radius:22px;padding:40px 20px 20px;text-align:center;}
  .iso-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;transform:rotateX(52deg) rotateZ(-45deg);transform-style:preserve-3d;width:230px;margin:10px auto 30px;}
  .iso-block{width:44px;height:44px;border-radius:6px;border:none;padding:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);}
  .globe-box{background:rgba(43,35,96,0.9);border-radius:22px;padding:40px 20px;display:flex;flex-direction:column;align-items:center;}
  .globe{width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7FE8FF,#5BD65B 55%,#2B2360 100%);box-shadow:0 0 60px rgba(127,232,255,.4), inset -20px -14px 46px rgba(0,0,0,.4);animation:spin 16s linear infinite;}
  @keyframes spin{from{filter:hue-rotate(0deg);}to{filter:hue-rotate(25deg);}}
  .pin-tag{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;font-size:11px;color:#fff;display:flex;align-items:center;gap:5px;}

  .sig-card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;max-width:520px;}
  .sig-top{display:flex;justify-content:space-between;align-items:center;}
  .sig-body{display:flex;align-items:center;gap:16px;margin-top:14px;}
  .lights{background:var(--ink);border-radius:14px;padding:9px 8px;display:flex;flex-direction:column;gap:6px;}
  .light{width:18px;height:18px;border-radius:50%;background:#453D7A;}
  .sig-time{font-size:30px;font-weight:700;}

  .modal-bg{position:fixed;inset:0;background:rgba(43,35,96,0.55);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;pointer-events:auto;}
  .modal{background:#fff;border-radius:22px;padding:24px;max-width:360px;width:100%;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;z-index:10001;pointer-events:auto;}

  textarea,input.field{width:100%;border-radius:14px;border:1px solid #eee;padding:11px;font-size:13px;font-family:inherit;margin-bottom:10px;}
  .cat-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;border:1px solid #eee;font-size:12px;font-weight:700;background:#fff;}
  .cat-btn.active{border:2px solid var(--orange);background:#FFEDE0;}

  .footer-note{text-align:center;color:rgba(255,255,255,0.8);font-size:12px;margin-top:20px;}

  /* ---- Sync / status badge ---- */
  .sync-badge{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:rgba(255,255,255,0.85);padding:6px 10px;border-radius:20px;background:rgba(255,255,255,0.14);}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--grass);flex-shrink:0;}
  .sync-dot.syncing{background:var(--sun);animation:pulse 1s ease-in-out infinite;}
  .sync-dot.offline{background:var(--red);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .offline-banner{background:#FFF3D6;color:#8A6100;border-radius:14px;padding:10px 14px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:16px;}

  /* ---- Auth ---- */
  .avatar-btn{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--sun),var(--pink));color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .auth-tabs{display:flex;gap:6px;background:#F2F0FF;border-radius:14px;padding:4px;margin-bottom:16px;}
  .auth-tabs button{flex:1;padding:9px;border-radius:11px;font-weight:700;font-size:12.5px;color:var(--muted);}
  .auth-tabs button.active{background:#fff;color:var(--ink);box-shadow:0 4px 10px rgba(43,35,96,.12);}
  .field-label{font-size:11px;font-weight:700;color:var(--muted);margin:0 0 5px 2px;display:block;}
  .auth-err{background:#FFE9EC;color:var(--red);font-size:11.5px;font-weight:700;padding:9px 11px;border-radius:11px;margin-bottom:10px;}
  .submit-btn{width:100%;border-radius:14px;padding:13px;font-weight:700;font-size:13.5px;color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;}
  .submit-btn:disabled{opacity:.6;}
  .userchip{display:flex;align-items:center;gap:10px;background:#F7F5FF;border-radius:16px;padding:12px 14px;margin-bottom:14px;}
  .userchip .av{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--sun),var(--pink));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  /* ---- Map (real) ---- */
  .map-search{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .map-search input{flex:1;min-width:180px;border-radius:14px;border:1px solid #eee;padding:11px 14px;font-size:13px;font-family:inherit;}
  .map-search button{white-space:nowrap;padding:11px 14px;border-radius:14px;font-weight:700;font-size:12.5px;color:#fff;background:var(--sky);display:flex;align-items:center;gap:6px;}
  .locate-btn{background:var(--purple)!important;}
  .real-map-frame{width:100%;height:360px;border:0;border-radius:18px;display:block;background:#E9E6FA;}
  .map-lite{background:#fff;border-radius:22px;padding:34px 20px;text-align:center;}
  .map-lite a{display:inline-flex;align-items:center;gap:7px;margin-top:14px;background:var(--sky);color:#fff;font-weight:700;font-size:12.5px;padding:11px 18px;border-radius:13px;}
  .loc-tag{display:inline-flex;align-items:center;gap:6px;background:#F2F0FF;color:var(--purple);font-weight:700;font-size:11.5px;padding:6px 11px;border-radius:11px;margin-bottom:10px;}
  .datasaver-btn{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;padding:6px 10px;border-radius:20px;}

  /* ---- Suggestions ---- */
  .sugg-card{background:#F7F5FF;border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;}
  .sugg-vote{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border-radius:12px;padding:8px 10px;flex-shrink:0;}
  .sugg-vote b{font-size:14px;}
  .tag-chip{display:inline-block;font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;background:#E5F8FF;color:var(--sky);margin-bottom:5px;}

  .skeleton{background:linear-gradient(90deg,#EEEBFB 25%,#F6F4FF 37%,#EEEBFB 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:12px;}
  @keyframes shimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

/* =========================================================
   v2 — Professional UI refresh + real maps
   ========================================================= */
:root{
  --ink:#132038; --muted:#66708A;
  --sky:#1B7FBF; --purple:#5A4BD1; --grass:#2E9E58; --sun:#D99700; --orange:#D4711F; --pink:#D33C6E; --red:#D63A3F;
  --line:#E8EBF3;
}
body{background:linear-gradient(165deg,#0E1B2E 0%, #16294A 45%, #123047 100%);}
.bg-base{background:linear-gradient(165deg,#0B1626 0%, #14243F 50%, #10293B 100%);}
.bg-glow{background:
  radial-gradient(ellipse 760px 420px at 18% 12%, rgba(38,150,220,0.18), transparent 62%),
  radial-gradient(ellipse 620px 500px at 86% 22%, rgba(90,75,209,0.16), transparent 62%);}
.bg-circuit{opacity:.35;}
header{background:rgba(12,24,42,0.72);border-bottom:1px solid rgba(255,255,255,0.10);}
.brand .logo{background:linear-gradient(135deg,#2E9BD6,#5A4BD1);border-radius:11px;}
.brand span{letter-spacing:-.2px;}
nav.links button{border-radius:10px;font-size:13px;}
nav.links button.active{background:#fff;color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.18);}
.card{border:1px solid var(--line);box-shadow:0 10px 30px rgba(8,18,35,.12);border-radius:18px;}
.hero{border-radius:20px;box-shadow:0 14px 40px rgba(8,18,35,.18);}
.fcard{border:1px solid var(--line);box-shadow:0 8px 22px rgba(8,18,35,.10);border-radius:16px;transition:transform .15s ease, box-shadow .15s ease;}
.fcard:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(8,18,35,.18);}
button{cursor:pointer;}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #2E9BD6;outline-offset:2px;}
textarea,input.field{border:1px solid var(--line);background:#FBFCFE;}

.fc-top{display:flex;align-items:flex-start;justify-content:space-between;width:100%;}
.fc-go{color:#B6BFD2;}
.sig-live{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:var(--grass);text-transform:uppercase;letter-spacing:.4px;}
.sig-live .dot{width:7px;height:7px;border-radius:50%;background:var(--grass);animation:sigpulse 1.4s infinite;}
@keyframes sigpulse{0%,100%{opacity:1;}50%{opacity:.25;}}
.sig-appr{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.sig-appr span{font-size:10.5px;font-weight:700;background:#EEF1F8;color:#2C3757;border-radius:8px;padding:4px 8px;display:flex;align-items:center;gap:4px;}
.sig-bar{height:6px;border-radius:99px;background:#E6EAF3;overflow:hidden;margin-top:9px;}
.sig-bar > i{display:block;height:100%;border-radius:99px;transition:width .9s linear;}
.sec-hero{display:flex;align-items:center;gap:12px;margin:2px 0 14px;padding:14px 16px;border-radius:18px;
  background:rgba(255,255,255,0.94);box-shadow:0 8px 22px rgba(12,20,45,.14);}
.sec-hero .sh-ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:0 0 44px;}
.sec-hero .sh-ic i{width:22px;height:22px;color:#fff;}
.sec-hero h1{margin:0;font-size:17px;font-weight:800;color:var(--ink,#16233F);letter-spacing:.1px;}
.sec-hero p{margin:2px 0 0;font-size:12px;color:#6B7794;font-weight:600;}
.card h2 i{flex:0 0 auto;}
.section-title{font-weight:700;color:#fff;font-size:13px;letter-spacing:.3px;text-transform:uppercase;opacity:.85;margin:18px 0 8px;}

/* ---- shared controls ---- */
.btn{border-radius:12px;padding:11px 15px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;color:#fff;background:var(--sky);border:none;}
.btn.ghost{background:#F3F6FC;color:var(--ink);border:1px solid var(--line);}
.btn.wide{width:100%;}
.btn.danger{background:var(--red);}
.btn.dark{background:var(--ink);}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;}
.chip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font-size:12.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.hint{font-size:11.5px;color:var(--muted);}

/* ---- location search ---- */
.loc-field{position:relative;flex:1;min-width:200px;}
.loc-field input{width:100%;border-radius:12px;border:1px solid var(--line);padding:12px 14px 12px 34px;font-size:13px;font-family:inherit;background:#FBFCFE;}
.loc-field .pin{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted);}
.sugg-list{position:absolute;z-index:60;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 36px rgba(8,18,35,.20);max-height:230px;overflow:auto;display:none;}
.sugg-list.open{display:block;}
.sugg-list button{display:block;width:100%;text-align:left;padding:10px 12px;font-size:12.5px;border-bottom:1px solid #F3F5FA;background:#fff;}
.sugg-list button:hover{background:#F3F8FF;}
.sugg-list .s2{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;}

/* ---- maps ---- */
.map-shell{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#DDE6F0;touch-action:none;}
.leaflet-container{font-family:inherit;}
#routeMap,#trafficMap,#cityMap,#liveMap{width:100%;height:420px;}
@media(max-width:640px){#routeMap,#trafficMap,#cityMap,#liveMap{height:320px;}}
.map-layers{position:absolute;top:10px;right:10px;z-index:500;display:flex;gap:6px;background:rgba(255,255,255,.94);padding:5px;border-radius:12px;box-shadow:0 6px 18px rgba(8,18,35,.18);}
.map-layers button{font-size:11px;font-weight:700;padding:7px 10px;border-radius:9px;color:var(--ink);background:transparent;}
.map-layers button.active{background:var(--ink);color:#fff;}
.map-legend{position:absolute;left:10px;bottom:10px;z-index:500;background:rgba(255,255,255,.94);border-radius:12px;padding:8px 10px;font-size:10.5px;font-weight:700;color:var(--ink);box-shadow:0 6px 18px rgba(8,18,35,.18);display:flex;gap:10px;flex-wrap:wrap;}
.map-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px;}
.freshness{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px;}
.freshness b{color:var(--ink);}
/* bigger, thumb-friendly zoom controls + easy pan/zoom on touch */
.leaflet-control-zoom{border:none!important;box-shadow:0 6px 18px rgba(8,18,35,.22)!important;border-radius:14px!important;overflow:hidden;}
.leaflet-control-zoom a{width:42px!important;height:42px!important;line-height:42px!important;font-size:20px!important;color:var(--ink)!important;background:rgba(255,255,255,.96)!important;}
.leaflet-control-zoom a:hover{background:#fff!important;}
.leaflet-touch .leaflet-control-zoom a{width:42px!important;height:42px!important;line-height:42px!important;}
.map-recenter{position:absolute;top:66px;right:10px;z-index:500;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.96);box-shadow:0 6px 18px rgba(8,18,35,.22);display:flex;align-items:center;justify-content:center;color:var(--purple);}
.map-hint{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);margin-top:8px;}


/* ---- route steps ---- */
.route-summary{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:#F4F8FD;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
.route-summary .big{font-size:22px;font-weight:800;color:var(--ink);}
.nav-dot{width:18px;height:18px;border-radius:50%;background:#1B7FBF;border:3px solid #fff;box-shadow:0 0 0 5px rgba(27,127,191,.28), 0 2px 8px rgba(0,0,0,.35);animation:navpulse 1.8s ease-in-out infinite;}
@keyframes navpulse{0%,100%{box-shadow:0 0 0 5px rgba(27,127,191,.28), 0 2px 8px rgba(0,0,0,.35);}50%{box-shadow:0 0 0 9px rgba(27,127,191,.12), 0 2px 8px rgba(0,0,0,.35);}}
.step{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid #F1F4FA;}
.step:last-child{border-bottom:none;}
.step .n{width:28px;height:28px;border-radius:9px;background:#EEF3FB;color:var(--sky);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step .t{font-size:13px;font-weight:700;}
.step .d{font-size:11px;color:var(--muted);margin-top:2px;}

/* ---- traffic ---- */
.jam-card{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #F1F4FA;}
.jam-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.level{font-size:10px;font-weight:800;padding:5px 9px;border-radius:9px;}

/* ---- reports ---- */
.rep{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;box-shadow:0 6px 18px rgba(8,18,35,.07);}
.rep.done{opacity:.62;}
.rep .status{font-size:10px;font-weight:800;padding:5px 9px;border-radius:9px;}

/* ---- globe ---- */
.globe-wrap{position:relative;background:radial-gradient(circle at 50% 40%, #16294A, #0A1424 70%);border-radius:18px;padding:14px;border:1px solid rgba(255,255,255,.08);}
#globeCanvas{width:100%;height:400px;display:block;cursor:grab;border-radius:14px;}
#globeCanvas:active{cursor:grabbing;}
@media(max-width:640px){#globeCanvas{height:300px;}}
.city-chip{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:9px 13px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;}
.city-chip.active{background:#fff;color:var(--ink);}
.globe-note{color:#B9C6DC;font-size:11.5px;text-align:center;margin-top:10px;}

/* ---- reviews ---- */
.review{background:#F7F9FD;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;}
.review .meta{font-size:10.5px;color:var(--muted);margin-top:3px;}
.stars button{font-size:17px;line-height:1;color:#D8DEEA;}
.stars button.on{color:#E8A400;}

/* =========================================================
   BACKEND LAYER
   ---------------------------------------------------------
   This app talks to storage through a small async api{} object,
   exactly like it would talk to a real REST backend. Every call
   is awaited and goes through the same request/response shape,
   so swapping window.storage for real fetch('/api/...') calls
   later means editing ONLY the six functions below — nothing
   in the UI code has to change.
   ========================================================= */
function lsGet(k, fallback){
  try{ const v = localStorage.getItem(k); return v===null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

const memoryDB = {}; // fallback "server" when window.storage isn't available (e.g. file opened locally)
function netDelay(){ return new Promise(r=>setTimeout(r, 220 + Math.random()*260)); }
async function apiGet(key, shared=false){
  setSync("syncing");
  try{
    await netDelay();
    if(window.storage){
      const res = await window.storage.get(key, shared);
      setSync("synced");
      return res ? JSON.parse(res.value) : null;
    }
    setSync("synced");
    return memoryDB[key] ?? null;
  }catch(e){
    if(window.storage){ setSync("synced"); return null; } // key simply doesn't exist yet
    setSync("offline");
    return memoryDB[key] ?? null;
  }
}
async function apiSet(key, value, shared=false){
  setSync("syncing");
  try{
    await netDelay();
    if(window.storage){
      await window.storage.set(key, JSON.stringify(value), shared);
    }else{
      memoryDB[key] = value;
    }
    setSync("synced");
    return true;
  }catch(e){
    setSync("offline");
    memoryDB[key] = value; // keep the UI working even if the network call failed
    return false;
  }
}
function setSync(s){ state.sync = s; paintSyncBadge(); }
function paintSyncBadge(){
  const el = document.getElementById("syncBadge"); if(!el) return;
  const map = {synced:["Synced",""], syncing:["Syncing…","syncing"], offline:["Offline · cached","offline"]};
  const [label, cls] = map[state.sync] || map.synced;
  el.innerHTML = `<div class="sync-badge"><span class="sync-dot ${cls}"></span>${label}</div>`;
}

}
function closeAuth(){

  state.auth.googleReverify=null; state.auth.reverifyOtpCode=""; state.auth.reverifyOtpErr=""; state.auth.reverifyErr="";
  render();
}
function setAuthMode(m){ state.auth.mode=m; state.auth.error=""; if(m==="signin") state.auth.pendingProfile=null; render(); }
function setAuthIdMethod(m){ state.auth.idMethod=m; state.auth.error=""; render(); }
function updateAuthField(k,v){ state.auth[k]=v; }

/* One-way ID hash used only to flag duplicate accounts — the raw Aadhaar / PAN number is never
   stored. Uses SubtleCrypto (SHA-256) where available (any https/localhost context); falls back to
   a lightweight local hash on contexts without it (e.g. a file:// preview). This is a client-side
   demo safeguard, not a substitute for real server-side Aadhaar/PAN e-KYC.
   Only Aadhaar or PAN ever back this hash — a phone number can't, on its own, guarantee one account
   per person (a person can hold many SIMs), so it is kept as a separate, non-identity contact field
   instead (see "Contact number" below). */
async function sha256Hex(str){
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){
    let h1=0,h2=0;
    for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=(h1*31+c)|0; h2=(h2*131+c)|0; }
    return (h1>>>0).toString(16)+(h2>>>0).toString(16);
  }
}
function normalizeIdValue(type, v){ v=(v||"").trim().replace(/\s+/g,""); return type==="pan" ? v.toUpperCase() : v; }
function idFormatValid(type, v){
  if(type==="aadhar") return /^\d{12}$/.test(v);
  if(type==="pan") return /^[A-Z]{5}[0-9]{4}[A-Z]$/.test(v);
  if(type==="phone") return /^[6-9]\d{9}$/.test(v);
  return false;
}
function idMaskedDisplay(type, v){
  if(type==="aadhar") return "XXXX XXXX "+v.slice(-4);
  if(type==="pan") return v.slice(0,2)+"XXXXX"+v.slice(-2);
  return "";
}
function idTypeLabel(type){ return type==="aadhar"?"Aadhaar number":"PAN"; }
async function hydrateUserData(email){
  const myReports = lsGet("scp_reports_"+email, null) || (await apiGet(`scp_reports_${email}`, false));
  if(myReports) state.maintenance = myReports;
  const myGovApps = lsGet("scp_gov_"+email, null) || (await apiGet(`scp_gov_${email}`, false));
  state.gov.applications = myGovApps || [];
}

/* ---- Prototype Google Sign-In ----
   Uses Google's Identity Services browser SDK. For a real Google account login,
   you must create a Web OAuth Client ID in Google Cloud and place it in GOOGLE_CLIENT_ID.
   For this hackathon prototype, a successful Google credential signs the user in directly
   without an extra Aadhaar/PAN step. Production must verify the Google credential server-side.
*/
const GOOGLE_CLIENT_ID = ""; // Paste your Google Web Client ID here.
function loadGoogleSDK(){
  if(window.__gsiLoading || document.getElementById("gsiScript")) return;
  window.__gsiLoading = true;
  const s = document.createElement("script");
  s.src="https://accounts.google.com/gsi/client"; s.async=true; s.defer=true; s.id="gsiScript";
  document.head.appendChild(s);
}
loadGoogleSDK();
function startGoogleAuth(){
  if(GOOGLE_CLIENT_ID){
    if(!(window.google && window.google.accounts && window.google.accounts.id)){
      state.auth.error="Google Sign-In is still loading — please try again in a moment.";
      render(); return;
    }
    google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID, callback:onGoogleCredential});
    google.accounts.id.prompt();
    return;
  }
  // Hackathon prototype mode: show a local Google-style account chooser so the demo
  // remains fully usable without requiring the presenter to configure OAuth first.
  state.auth.demoGoogleOpen=true; state.auth.error=""; render();
}
function closeDemoGoogle(){ state.auth.demoGoogleOpen=false; render(); }
async function demoGoogleSelect(name,email){
  state.auth.demoGoogleOpen=false;
  await completeGoogleSignIn(name,email);
}
function renderDemoGoogleModal(){
  if(!state.auth.demoGoogleOpen) return '';
  const accounts=[
    {name:'Demo Citizen',email:'citizen@suratsmartcity.demo'},
    {name:'Hackathon Presenter',email:'presenter@suratsmartcity.demo'},
    {name:'Surat Resident',email:'resident@suratsmartcity.demo'}
  ];
  return `<div class="modal-bg" onclick="if(event.target===this)closeDemoGoogle()">
    <div class="modal" style="max-width:390px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div><div class="fk" style="font-weight:700;font-size:16px;">Choose a Google account</div><div class="hint">Prototype sign-in for hackathon demo</div></div>
        <button onclick="closeDemoGoogle()" style="background:#F2F0FF;border-radius:10px;padding:6px;"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
      </div>
      ${accounts.map(a=>`<button class="userchip" style="width:100%;text-align:left;cursor:pointer;margin-bottom:8px;" onclick="demoGoogleSelect(${jsAttr(a.name)},${jsAttr(a.email)})">
        <span class="av">${initials(a.name)}</span><span><span style="display:block;font-weight:700;font-size:12.5px;">${escHtml(a.name)}</span><span style="display:block;font-size:10.5px;color:var(--muted);">${escHtml(a.email)}</span></span>
      </button>`).join('')}
      <div class="hint" style="margin-top:10px;">Demo mode is enabled because no Google OAuth Client ID is configured. Add your Client ID later to use real Google accounts.</div>
    </div></div>`;
}
function onGoogleCredential(resp){
  try{
    const payload = JSON.parse(atob(resp.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
    completeGoogleSignIn(payload.name || (payload.email||"").split("@")[0], (payload.email||"").toLowerCase());
  }catch(e){
    state.auth.error="Couldn't read your Google account details — please try again.";
    render();
  }
}
async function completeGoogleSignIn(name, email){
  const users = (await apiGet("scp_users", true)) || lsGet("scp_users", []) || [];
  let existing = users.find(u=>u.email===email);
  if(!existing){
    existing = {
      name: name || email.split("@")[0],
      email,
      pass: null,
      joined: new Date().toISOString().slice(0,10),
      idType: "google",
      idHash: null,
      idMasked: "Google account",
      contactPhone: "",
      authProvider: "google"
    };
    users.push(existing);
    lsSet("scp_users", users);
    await apiSet("scp_users", users, true);
  }

  const session = {name: existing.name || name || email.split("@")[0], email};
  state.auth.user = session;
  lsSet("scp_session", session);
  lsSet("scp_users", users);
  await apiSet("scp_session", session, false);
  await hydrateUserData(email);
  state.auth.open = false;
  state.auth.googleReverify = null;
  state.auth.pendingProfile = null;
  state.auth.error = "";
  render();
}
function verifyGoogleReverifyOtp(){
  const entered = document.getElementById("reverifyOtpInput")?.value||"";
  if(entered && entered===state.auth.reverifyOtpCode){ finalizeGoogleReverify(); }
  else{ state.auth.reverifyOtpErr="Incorrect code — please try again."; render(); }
}
async function verifyGoogleReverifyPan(){
  const gr = state.auth.googleReverify;
  const entered = normalizeIdValue("pan", document.getElementById("reverifyPanInput")?.value||"");
  if(!idFormatValid("pan", entered)){ state.auth.reverifyErr="Enter a valid PAN number."; render(); return; }
  const hash = await sha256Hex("pan:"+entered);
  if(hash !== gr.idHash){ state.auth.reverifyErr="That PAN doesn't match our records for this account."; render(); return; }
  finalizeGoogleReverify();
}
async function finalizeGoogleReverify(){
  const gr = state.auth.googleReverify;
  state.auth.user = {name:gr.name, email:gr.email};
  lsSet("scp_session", state.auth.user);
  await apiSet("scp_session", state.auth.user, false);
  await hydrateUserData(state.auth.user.email);
  state.auth.open=false; state.auth.googleReverify=null; state.auth.error="";
  render();
}

async function submitAuth(){
  const a = state.auth;
  const usingGoogle = !!a.pendingProfile;
  const name = (document.getElementById("authName")?.value||"").trim() || (usingGoogle ? a.pendingProfile.name : "");
  const email = ((document.getElementById("authEmail")?.value||"") || (usingGoogle ? a.pendingProfile.email : "")).trim().toLowerCase();
  const pass = (document.getElementById("authPass")?.value||"");
  if(!email || (!usingGoogle && !pass) || (a.mode==="signup" && !name)){ a.error="Please fill in every field."; render(); return; }
  a.busy=true; a.error=""; render();
  const users = (await apiGet("scp_users", true)) || lsGet("scp_users", []) || [];
  if(a.mode==="signup"){
    if(users.find(u=>u.email===email)){ a.busy=false; a.error="An account with this email already exists — sign in instead."; render(); return; }

    // ID-based duplicate check — Aadhaar or PAN only. These are the only IDs that can guarantee
    // one account per person; a phone number is collected separately, purely as a contact detail.
    const idType = a.idMethod;
    const idValueRaw = normalizeIdValue(idType, document.getElementById("authIdValue")?.value||"");
    if(!idFormatValid(idType, idValueRaw)){
      a.busy=false;
      a.error = idType==="aadhar" ? "Enter a valid 12-digit Aadhaar number." : "Enter a valid PAN number (e.g. ABCDE1234F).";
      render(); return;
    }
    const idHash = await sha256Hex(idType+":"+idValueRaw);
    if(users.find(u=>u.idHash===idHash)){
      a.busy=false;
      a.error = "This "+idTypeLabel(idType)+" is already linked to an account — only one account is allowed per person.";
      render(); return;
    }

    // Optional contact number — a separate way to reach the person; not used for identity or
    // duplicate-checking, so it's fine if it isn't linked to their Aadhaar/PAN or Google account.
    const contactRaw = (document.getElementById("authContact")?.value||"").trim();
    let contactPhone = "";
    if(contactRaw){
      if(!/^[6-9]\d{9}$/.test(contactRaw)){ a.busy=false; a.error="Enter a valid 10-digit contact number, or leave it blank."; render(); return; }
      contactPhone = contactRaw;
    }

    const user = {name, email, pass: usingGoogle?null:pass, joined:new Date().toISOString().slice(0,10),
                  idType, idHash, idMasked:idMaskedDisplay(idType, idValueRaw), contactPhone,
                  authProvider: usingGoogle?"google":"password"};
    users.push(user);
    lsSet("scp_users", users);
    await apiSet("scp_users", users, true);
    a.user = {name:user.name, email:user.email};
  }else{
    const found = users.find(u=>u.email===email && u.pass===pass);
    if(!found){ a.busy=false; a.error="No matching account. Check your email and password."; render(); return; }
    a.user = {name:found.name, email:found.email};
  }
  lsSet("scp_session", a.user);
  lsSet("scp_users", users);
  await apiSet("scp_session", a.user, false);
  await hydrateUserData(a.user.email);
  a.busy=false; a.open=false; a.error=""; a.pendingProfile=null;
  render();
}
async function signOut(){
  if(state.auth.user){
    lsSet("scp_reports_"+state.auth.user.email, state.maintenance);
    lsSet("scp_gov_"+state.auth.user.email, state.gov.applications);
  }
  state.auth.user=null;
  state.gov.applications=[];
  lsDel("scp_session");
  await apiSet("scp_session", null, false);
  render();
}
function requireAuth(){
  if(state.auth.user) return true;
  openAuth("signin");
  return false;
}

/* ---------------- Location ---------------- */
function useMyLocation(){
  if(!navigator.geolocation){ state.location.error="Location isn't supported on this device."; render(); return; }
  state.location.loading=true; state.location.error=""; render();
  navigator.geolocation.getCurrentPosition(
    pos=>{
      state.location.lat=pos.coords.latitude; state.location.lng=pos.coords.longitude;
      state.location.label="My current location"; state.location.loading=false;
      state.mapQuery = `${pos.coords.latitude},${pos.coords.longitude}`;
      render();
    },
    err=>{ state.location.loading=false; state.location.error="Couldn't get your location — check permissions."; render(); },
    {enableHighAccuracy:true, timeout:8000}
  );
}
function searchLocation(){
  const q = document.getElementById("mapSearchInput")?.value.trim();
  if(!q) return;
  state.mapQuery=q; state.location.label=q; state.location.lat=null; state.location.lng=null;
  render();
}

function aiScoreClass(score){return score>=80?'#34d399':score>=60?'#fbbf24':'#fb7185';}
function civicStatusLabel(status){
  if(status==='Resolved') return 'Resolved';
  if(status==='In progress') return 'In progress';
  if(status==='Withdrawn') return 'Withdrawn';
  return 'Received';
}
function civicStatusClass(status){
  if(status==='Resolved') return 'done';
  if(status==='In progress') return 'progress';
  if(status==='Withdrawn') return 'withdrawn';
  return 'received';
}
function buildUrbanAI(){
  const u=state.urbanAI;
  let score=100, factors=[], rec=[];
  const total=u.traffic.count||0, heavy=u.traffic.heavy||0, moderate=u.traffic.moderate||0;
  const incidents=state.accidentAlerts||[];
  const reports=(state.maintenance||[]).filter(x=>x.status!=='Withdrawn');
  const activeAlerts=(state.civicAlerts||[]).filter(a=>a.severity==='Severe'||a.severity==='Warning');
  const abnormalUtilities=(state.utilities||[]).filter(x=>String(x.status||'').toLowerCase()!=='normal');
  const highSeverityReports=reports.filter(x=>x.severity==='High');

  if(total){
    const ratio=heavy/total;
    const d=Math.min(26,Math.round(ratio*24+(moderate/total)*7));
    score-=d;
    factors.push({title:`Traffic pressure: ${heavy} heavy / ${moderate} moderate`,detail:`${total} mapped junctions analyzed around Surat`,impact:d});
    if(ratio>=.25) rec.push('Prioritize alternate-route messaging around heavy-congestion clusters.');
    else if(ratio>=.12) rec.push('Monitor major junctions and consider congestion advisories.');
  }
  if(incidents.length){
    const d=Math.min(20,incidents.length*4);
    score-=d;
    factors.push({title:`Road incidents: ${incidents.length}`,detail:'Citizen-reported incidents currently visible to the portal',impact:d});
    if(incidents.length>=2) rec.push('Prioritize verification of recent incidents and traffic diversion messaging.');
  }
  if(reports.length){
    const d=Math.min(18,Math.ceil(reports.length/2)+Math.min(6,highSeverityReports.length*2));
    score-=d;
    factors.push({title:`Open civic reports: ${reports.length}`,detail:`${highSeverityReports.length} marked high severity`,impact:d});
    if(highSeverityReports.length) rec.push('Escalate high-severity civic complaints for faster field verification.');
  }
  if(activeAlerts.length){
    const d=Math.min(18,activeAlerts.length*6);
    score-=d;
    factors.push({title:`Active city advisories: ${activeAlerts.length}`,detail:'Warning/Severe civic alerts currently active',impact:d});
    rec.push('Surface active city advisories prominently and keep residents informed.');
  }
  if(abnormalUtilities.length){
    const d=Math.min(12,abnormalUtilities.length*4);
    score-=d;
    factors.push({title:`Utility disruptions: ${abnormalUtilities.length}`,detail:'Power, water, gas or internet not marked Normal',impact:d});
    rec.push('Prioritize service-restoration messaging for affected utility zones.');
  }
  if(!factors.length){
    factors.push({title:'No critical city signals detected',detail:'Waiting for live civic and traffic data',impact:0});
  }
  score=Math.max(0,Math.min(100,Math.round(score)));
  u.score=score;
  u.level=score>=80?'Healthy city conditions':score>=60?'Watch conditions':'Elevated urban risk';
  u.factors=factors.filter(f=>f.impact>0).slice(0,5);
  u.recommendations=[...new Set(rec)].slice(0,3);
  u.summary=score>=80?'Overall city conditions look stable, with no major concentration of civic risk signals.':score>=60?'City conditions are generally manageable, but some active issues need attention.':'Several urban risk signals are elevated; residents and city teams should prioritize active incidents and service disruptions.';
  u.updated=new Date();
}
async function loadUrbanTrafficPulse(){
  const u=state.urbanAI; u.busy=true;
  try{
    const lat=SURAT.lat,lng=SURAT.lng;
    const q=`[out:json][timeout:5];node(around:4500,${lat},${lng})[highway=traffic_signals];out body 100;`;
    const j=await overpassFetch(q);
    const list=(j.elements||[]).map(n=>({id:'n'+n.id}));
    let heavy=0,moderate=0,free=0;
    list.forEach(n=>{const c=congestionFor(n.id);if(c.level==='Heavy')heavy++;else if(c.level==='Moderate')moderate++;else free++;});
    u.traffic={count:list.length,heavy,moderate,free};
    u.source='OpenStreetMap junctions + citizen reports + civic alerts + utility status';
  }catch(e){
    u.source='Cached civic inputs (live junction feed unavailable)';
  }
  buildUrbanAI();
  u.busy=false;
  u.updated=new Date();
  if(state.view==='dashboard') render();
}

/* ---- three.js globe ---- */
let GLOBE = null;
function destroyGlobe(){
  if(GLOBE){
    cancelAnimationFrame(GLOBE.raf);
    try{ GLOBE.renderer.dispose(); }catch(e){}
    GLOBE = null;
  }
}
function latLngToVec3(lat,lng,r){
  const phi = (90-lat)*Math.PI/180, theta = (lng+180)*Math.PI/180;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
}
function initGlobe(){
  const canvas = document.getElementById("globeCanvas");
  if(!canvas || typeof THREE === "undefined") return;
  const w = canvas.clientWidth || 600, h = canvas.clientHeight || 400;
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(w,h,false);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, w/h, 0.1, 1000);
  camera.position.set(0,0,3.1);

  const R = 1;
  const loader = new THREE.TextureLoader();
  loader.crossOrigin = "anonymous";
  const mat = new THREE.MeshPhongMaterial({color:0x2b6ea8, shininess:8});
  loader.load("https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg",
    tex=>{ mat.map = tex; mat.color = new THREE.Color(0xffffff); mat.needsUpdate = true; });
  const earth = new THREE.Mesh(new THREE.SphereGeometry(R,64,64), mat);
  const world = new THREE.Group();
  world.add(earth);

  // soft atmosphere
  const glow = new THREE.Mesh(new THREE.SphereGeometry(R*1.03,48,48),
    new THREE.MeshBasicMaterial({color:0x5fb8ff, transparent:true, opacity:0.10, side:THREE.BackSide}));
  world.add(glow);

  // city markers
  const markers = [];
  NEARBY_CITIES.forEach(c=>{
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.018,16,16),
      new THREE.MeshBasicMaterial({color: c.name==="Surat" ? 0xffc23d : 0xff5f8f}));
    m.position.copy(latLngToVec3(c.lat,c.lng,R*1.01));
    m.userData.city = c.name;
    world.add(m);
    markers.push(m);
    const ring = new THREE.Mesh(new THREE.SphereGeometry(0.032,16,16),
      new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.22}));
    ring.position.copy(m.position);
    world.add(ring);
  });
  scene.add(world);
  scene.add(new THREE.AmbientLight(0xffffff, 0.85));
  const dir = new THREE.DirectionalLight(0xffffff, 0.9); dir.position.set(3,2,4); scene.add(dir);

  // start looking at Gujarat
  world.rotation.y = -(SURAT.lng+180)*Math.PI/180 + Math.PI/2;
  world.rotation.x = SURAT.lat*Math.PI/180*0.6;

  let drag=false, px=0, py=0, spin=0.0016;
  const onDown = e=>{ drag=true; spin=0; px=(e.touches?e.touches[0].clientX:e.clientX); py=(e.touches?e.touches[0].clientY:e.clientY); };
  const onMove = e=>{
    if(!drag) return;
    const x=(e.touches?e.touches[0].clientX:e.clientX), y=(e.touches?e.touches[0].clientY:e.clientY);
    world.rotation.y += (x-px)*0.005;
    world.rotation.x = Math.max(-1.2, Math.min(1.2, world.rotation.x + (y-py)*0.005));
    px=x; py=y;
    if(e.touches) e.preventDefault();
  };
  const onUp = ()=>{ drag=false; };
  canvas.addEventListener("mousedown",onDown); canvas.addEventListener("touchstart",onDown,{passive:true});
  window.addEventListener("mousemove",onMove); canvas.addEventListener("touchmove",onMove,{passive:false});
  window.addEventListener("mouseup",onUp); canvas.addEventListener("touchend",onUp);
  canvas.addEventListener("wheel", e=>{
    e.preventDefault();
    camera.position.z = Math.max(1.45, Math.min(6, camera.position.z + e.deltaY*0.0016));
  }, {passive:false});

  // click a marker to open that city's map
  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
  canvas.addEventListener("click", e=>{
    const rect = canvas.getBoundingClientRect();
    mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
    mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
    ray.setFromCamera(mouse,camera);
    const hit = ray.intersectObjects(markers)[0];
    if(hit && hit.object.userData.city) openCityMap(hit.object.userData.city);
  });

  const resize = ()=>{
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    if(!cw||!ch) return;
    renderer.setSize(cw,ch,false); camera.aspect=cw/ch; camera.updateProjectionMatrix();
  };
  window.addEventListener("resize", resize);

  GLOBE = {renderer, raf:0};
  (function loop(){
    GLOBE.raf = requestAnimationFrame(loop);
    if(!drag) world.rotation.y += spin;
    renderer.render(scene,camera);
  })();
}

function hasLeaflet(){ return typeof L !== "undefined" && L.map; }
function baseLayer(kind){
  if(kind==="satellite"){
    return L.layerGroup([
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {maxZoom:19, attribution:"Imagery &copy; Esri, Maxar, Earthstar Geographics"}),
      L.tileLayer("https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png",{maxZoom:19})
    ]);
  }
  return L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:19, attribution:"&copy; OpenStreetMap contributors"});
}
function makeMap(id, center, zoom){
  if(!hasLeaflet()) return null;
  const el = document.getElementById(id);
  if(!el) return null;
  const map = L.map(id,{
    zoomControl:false, scrollWheelZoom:true, wheelDebounceTime:40, wheelPxPerZoomLevel:90,
    dragging:true, touchZoom:true, doubleClickZoom:true, boxZoom:true, keyboard:true, tap:true,
    fadeAnimation:false, zoomAnimation:false, markerZoomAnimation:false, inertia:true,
  }).setView([center.lat,center.lng], zoom);
  baseLayer(state.baseKind).addTo(map);
  L.control.zoom({position:"bottomright"}).addTo(map);
  LMAPS[id] = map;
  setTimeout(()=>{ try{ map.invalidateSize(); }catch(e){} }, 120);
  return map;
}
function recenterMap(id, center, zoom){
  const map = LMAPS[id];
  if(!map) return;
  map.setView([center.lat, center.lng], zoom || map.getZoom(), {animate:false});
}
function setBaseKind(kind){ state.baseKind = kind; lsSet("scp_base", kind); render(); }

/* ---------------- Geocoding (search any place in / around the city) --------------- */
async function geoSearch(q, near){
  const c = near || SURAT;
  const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=7&lang=en&lat=${c.lat}&lon=${c.lng}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("search failed");
  const j = await res.json();
  return (j.features||[]).map(f=>{
    const p = f.properties||{};
    const label = [p.name, p.street, p.suburb || p.district, p.city || p.county, p.state].filter(Boolean).join(", ");
    return {name:p.name || p.street || label || "Unnamed place", label: label || "Unnamed place",
            lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0]};
  });
}
async function reverseGeo(lat,lng){
  try{
    const res = await fetch(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lng}&lang=en`);
    const j = await res.json();
    const p = (j.features && j.features[0] && j.features[0].properties) || {};
    const label = [p.name,p.street,p.suburb||p.district,p.city,p.state].filter(Boolean).join(", ");
    return label || `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  }catch(e){ return `${lat.toFixed(4)}, ${lng.toFixed(4)}`; }
}

/* Autocomplete field: updates the DOM directly so typing is never interrupted. */
function locField(key, placeholder, onPickFn){
  const v = state.route[key] ? state.route[key].label : (state.routeText[key]||"");
  return `<div class="loc-field">
    <i data-lucide="map-pin" class="pin"></i>
    <input id="in-${key}" autocomplete="off" placeholder="${placeholder}" value="${escAttr(v)}"
      oninput="onLocInput('${key}',this.value)"
      onkeydown="if(event.key==='Enter'){event.preventDefault();pickFirstSuggestion('${key}');}"/>
    <div class="sugg-list" id="sl-${key}"></div>
  </div>`;
}
function escAttr(s){ return String(s||"").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
/* Safely embed a dynamic string as a JS argument inside an onclick="" HTML attribute */
function jsAttr(v){ return JSON.stringify(String(v==null?"":v)).replace(/"/g,"&quot;"); }
function directionsTo(name, lat, lng){
  state.route.to = {name, label:name, lat, lng};
  state.routeText.to = name;
  state.route.result = null;
  setView("route");
}
let locTimers = {}, locResults = {};
function onLocInput(key, val, pickerFn){
  pickerFn = pickerFn || "pickLoc";
  state.routeText[key] = val;
  state.route[key] = null;
  clearTimeout(locTimers[key]);
  const box = document.getElementById("sl-"+key);
  if(!val || val.trim().length < 2){ if(box){ box.className="sugg-list"; box.innerHTML=""; } return; }
  locTimers[key] = setTimeout(async ()=>{
    try{
      const list = await geoSearch(val, state.traffic.center || SURAT);
      locResults[key] = list;
      const b = document.getElementById("sl-"+key);
      if(!b) return;
      if(!list.length){ b.className="sugg-list open"; b.innerHTML=`<button type="button">No matches found</button>`; return; }
      b.className = "sugg-list open";
      b.innerHTML = list.map((r,i)=>`<button type="button" onclick="${pickerFn}('${key}',${i})">${r.name}<span class="s2">${r.label}</span></button>`).join("");
    }catch(e){
      const b = document.getElementById("sl-"+key);
      if(b){ b.className="sugg-list open"; b.innerHTML=`<button type="button">Search unavailable — check your connection</button>`; }
    }
  }, 320);
}
function pickLoc(key, i){
  const r = (locResults[key]||[])[i];
  if(!r) return;
  state.route[key] = r;
  state.routeText[key] = r.label;
  const inp = document.getElementById("in-"+key);
  if(inp) inp.value = r.label;
  const b = document.getElementById("sl-"+key);
  if(b){ b.className="sugg-list"; b.innerHTML=""; }
}
function pickFirstSuggestion(key){
  if((locResults[key]||[]).length) pickLoc(key,0);
  else findRoute();
}
async function resolveField(key){
  if(state.route[key]) return state.route[key];
  const txt = (document.getElementById("in-"+key)?.value || state.routeText[key] || "").trim();
  if(!txt) return null;
  const list = await geoSearch(txt, state.traffic.center || SURAT);
  if(!list.length) return null;
  state.route[key] = list[0];
  state.routeText[key] = list[0].label;
  return list[0];
}
function swapRoute(){
  if(state.route.nav.active) endJourney();
  const f = state.route.from, t = state.route.to;
  state.route.from = t; state.route.to = f;
  const ft = state.routeText.from, tt = state.routeText.to;
  state.routeText.from = tt; state.routeText.to = ft;
  render();
}
async function useMyLocationFor(key){
  if(!navigator.geolocation){ state.route.error="Location is not supported on this device."; render(); return; }
  state.route.locating = key; render();
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    const label = await reverseGeo(lat,lng);
    state.route[key] = {name:"My location", label, lat, lng};
    state.routeText[key] = label;
    state.route.locating = null;
    render();
  }, err=>{ state.route.locating=null; state.route.error="Couldn't read your GPS location — please allow location access."; render(); },
  {enableHighAccuracy:true, timeout:10000});
}

/* ---------------- Travel modes + routing ---------------- */
const MODES = [
  {id:"car",   label:"Car",            icon:"car",       engine:"routed-car",  factor:1.00},
  {id:"bike",  label:"Two-wheeler",    icon:"bike",      engine:"routed-car",  factor:0.90},
  {id:"transit",label:"Public transport",icon:"bus",      engine:"routed-car",  factor:1.45},
  {id:"walk",  label:"Walking",        icon:"footprints",engine:"routed-foot", factor:1.00},
];
function setMode(m){ if(state.route.nav.active) endJourney(); state.route.mode=m; if(state.route.from && state.route.to) findRoute(); else render(); }
function fmtDur(sec){
  const m = Math.round(sec/60);
  if(m < 60) return m + " min";
  return Math.floor(m/60) + " hr " + (m%60) + " min";
}
function maneuverIcon(step){
  const t = (step.maneuver && step.maneuver.modifier) || "";
  if(t.includes("left")) return "corner-up-left";
  if(t.includes("right")) return "corner-up-right";
  if((step.maneuver&&step.maneuver.type)==="arrive") return "flag";
  if((step.maneuver&&step.maneuver.type)==="roundabout") return "rotate-cw";
  return "arrow-up";
}
function stepText(step){
  const m = step.maneuver || {};
  const road = step.name || "the road";
  const mod = m.modifier ? m.modifier.replace(/-/g," ") : "";
  if(m.type==="depart") return `Head ${mod||"out"} on ${road}`;
  if(m.type==="arrive") return `Arrive at your destination`;
  if(m.type==="roundabout"||m.type==="rotary") return `Take the roundabout onto ${road}`;
  if(m.type==="merge") return `Merge ${mod} onto ${road}`;
  if(m.type==="fork") return `Keep ${mod} onto ${road}`;
  if(m.type==="new name") return `Continue on ${road}`;
  if(mod) return `Turn ${mod} onto ${road}`;
  return `Continue on ${road}`;
}
async function findRoute(){
  if(state.route.nav.active) endJourney();
  const mode = MODES.find(m=>m.id===state.route.mode) || MODES[0];
  state.route.error=""; state.route.busy=true; state.route.result=null; render();
  try{
    const from = await resolveField("from");
    const to   = await resolveField("to");
    if(!from || !to){ state.route.busy=false; state.route.error="Please choose both a start and a destination."; render(); return; }
    const url = `https://routing.openstreetmap.de/${mode.engine}/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson&steps=true&alternatives=false`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("routing failed");
    const j = await res.json();
    if(!j.routes || !j.routes.length) throw new Error("no route");
    const r = j.routes[0];
    state.route.from = from;
    state.route.to = to;
    state.route.result = {
      distance: r.distance,
      duration: r.duration * mode.factor,
      coords: r.geometry.coordinates.map(c=>[c[1],c[0]]),
      steps: (r.legs[0] && r.legs[0].steps) || [],
      mode: mode.id,
    };
    // Unified mobility state: the same chosen route powers traffic analysis, signal timing and incidents.
    state.traffic.routeFrom = from;
    state.traffic.destPoint = to;
    state.traffic.routeOptions = [{distance:r.distance,duration:r.duration * mode.factor,coords:r.geometry.coordinates.map(c=>[c[1],c[0]])}];
    state.traffic.selectedRouteIdx = 0;
    state.traffic.routeJunctions = [];
    state.traffic.routeJunctionsSource = "";
    state.route.busy=false;
    render();
    loadTrafficAlongRoute();
  }catch(e){
    state.route.busy=false;
    state.route.error="Route service is unavailable right now — please try again in a moment.";
    render();
  }
}
function drawRouteMap(){
  navMarker = null;
  const map = makeMap("trafficMap", state.route.from || SURAT, 13);
  if(!map) return;
  const r = state.route.result;
  if(state.route.from) L.marker([state.route.from.lat,state.route.from.lng]).addTo(map).bindPopup("Start: "+state.route.from.label);
  if(state.route.to)   L.marker([state.route.to.lat,state.route.to.lng]).addTo(map).bindPopup("Destination: "+state.route.to.label);
  if(r && r.coords.length){
    const color = r.mode==="walk" ? "#2E9E58" : r.mode==="transit" ? "#D33C6E" : r.mode==="bike" ? "#D4711F" : "#1B7FBF";
    L.polyline(r.coords,{color:"#0E1B2E",weight:9,opacity:.25}).addTo(map);
    L.polyline(r.coords,{color, weight:5, opacity:.95}).addTo(map);
    map.fitBounds(L.latLngBounds(r.coords).pad(0.12), {animate:false});
  }else if(state.route.from && state.route.to){
    map.fitBounds(L.latLngBounds([[state.route.from.lat,state.route.from.lng],[state.route.to.lat,state.route.to.lng]]).pad(0.2), {animate:false});
  }
  // live citizen accident reports shown on the route map
  state.accidentAlerts.forEach(a=>{
    if(a.lat && a.lng) L.circleMarker([a.lat,a.lng],{radius:8,color:"#D63A3F",fillColor:"#D63A3F",fillOpacity:.75})
      .addTo(map).bindPopup(`<b>${a.location}</b><br>${a.desc}`);
  });
  if(state.route.nav.active) initNavOnMap();
}

/* =========================================================
   LIVE NAVIGATION — "Start journey" (Google-Maps-style):
   watches the device's live GPS position, drops a live marker
   on the route map, and keeps distance-to-destination and ETA
   updated in place (no full re-render, so the map never flickers).
   ========================================================= */
function initNavOnMap(){
  const map = LMAPS["trafficMap"];
  if(!map) return;
  const nav = state.route.nav;
  const p = nav.pos || (state.route.from ? {lat:state.route.from.lat, lng:state.route.from.lng} : null);
  if(!p) return;
  const icon = L.divIcon({className:"", html:'<div class="nav-dot"></div>', iconSize:[20,20], iconAnchor:[10,10]});
  navMarker = L.marker([p.lat,p.lng], {icon, zIndexOffset:1000}).addTo(map);
}
function updateNavMarker(lat,lng){
  const map = LMAPS["trafficMap"];
  if(!map) return;
  if(!navMarker){
    const icon = L.divIcon({className:"", html:'<div class="nav-dot"></div>', iconSize:[20,20], iconAnchor:[10,10]});
    navMarker = L.marker([lat,lng], {icon, zIndexOffset:1000}).addTo(map);
  }else{
    navMarker.setLatLng([lat,lng]);
  }
  try{ map.panTo([lat,lng], {animate:true}); }catch(e){}
}
function nearestCoordIndex(coords, lat, lng){
  let best=0, bestKm=Infinity;
  for(let i=0;i<coords.length;i++){
    const d = haversineKm({lat,lng},{lat:coords[i][0],lng:coords[i][1]});
    if(d<bestKm){ bestKm=d; best=i; }
  }
  return {idx:best, km:bestKm};
}
function remainingRouteKm(coords, idx){
  let d=0;
  for(let i=idx;i<coords.length-1;i++) d += haversineKm({lat:coords[i][0],lng:coords[i][1]},{lat:coords[i+1][0],lng:coords[i+1][1]});
  return d;
}
function paintNavPanel(){
  const nav = state.route.nav;
  const remEl = document.getElementById("nav-remaining");
  const etaEl = document.getElementById("nav-eta");
  const turnEl = document.getElementById("nav-nextturn");
  const bnr = document.getElementById("nav-banner");
  if(remEl) remEl.textContent = nav.remainingKm!=null ? nav.remainingKm.toFixed(2)+" km" : "Locating…";
  if(etaEl) etaEl.textContent = nav.remainingSec!=null ? fmtDur(nav.remainingSec) : "—";
  if(turnEl) turnEl.textContent = nav.nextStep ? stepText(nav.nextStep) : "Follow the highlighted route";
  if(bnr) bnr.style.display = nav.arrived ? "flex" : "none";
  const errEl = document.getElementById("nav-error");
  if(errEl) errEl.textContent = nav.error || "";
  if(errEl) errEl.style.display = nav.error ? "block" : "none";
}
function updateNavPosition(lat, lng){
  const nav = state.route.nav;
  const r = state.route.result;
  nav.pos = {lat,lng};
  nav.error = "";
  if(r && r.coords && r.coords.length){
    const {idx, km:offRoute} = nearestCoordIndex(r.coords, lat, lng);
    const remainingKm = offRoute + remainingRouteKm(r.coords, idx);
    nav.remainingKm = remainingKm;
    const totalKm = r.distance/1000;
    const fraction = totalKm>0 ? Math.min(1, remainingKm/totalKm) : 0;
    nav.remainingSec = Math.round(r.duration * fraction);
    if(r.steps && r.steps.length){
      let bestI=0, bestD=Infinity;
      r.steps.forEach((s,i)=>{
        if(!s.maneuver || !s.maneuver.location) return;
        const [slng,slat] = s.maneuver.location;
        const d = haversineKm({lat,lng},{lat:slat,lng:slng});
        if(d<bestD){ bestD=d; bestI=i; }
      });
      nav.nextStep = r.steps[Math.min(bestI+1, r.steps.length-1)] || r.steps[bestI];
    }
    if(remainingKm*1000 < 60 && !nav.arrived){
      nav.arrived = true;
      if(nav.watchId!=null && navigator.geolocation){ navigator.geolocation.clearWatch(nav.watchId); nav.watchId=null; }
    }
  }
  updateNavMarker(lat,lng);
  paintNavPanel();
}
function startJourney(){
  const nav = state.route.nav;
  if(!state.route.result) return;
  if(!navigator.geolocation){ nav.error="Live location isn't supported on this device."; render(); return; }
  nav.active=true; nav.arrived=false; nav.error=""; nav.pos=null; nav.remainingKm=null; nav.remainingSec=null; nav.nextStep=null;
  render();
  nav.watchId = navigator.geolocation.watchPosition(
    pos=>updateNavPosition(pos.coords.latitude, pos.coords.longitude),
    err=>{ nav.error="Couldn't read your live location — check location permissions."; paintNavPanel(); },
    {enableHighAccuracy:true, maximumAge:2000, timeout:15000}
  );
}
function endJourney(){
  const nav = state.route.nav;
  if(nav.watchId!=null && navigator.geolocation){ try{ navigator.geolocation.clearWatch(nav.watchId); }catch(e){} }
  nav.active=false; nav.watchId=null; nav.arrived=false; nav.pos=null; nav.remainingKm=null; nav.remainingSec=null; nav.nextStep=null; nav.error="";
  if(navMarker){ try{ const map=LMAPS["trafficMap"]; if(map) map.removeLayer(navMarker); }catch(e){} navMarker=null; }
  render();
}
function viewRoute(){ return viewTraffic(); }

/* =========================================================
   TRAFFIC — GPS + live junction congestion within 3 km
   ========================================================= */
function levelColor(l){ return l==="Heavy" ? "#D63A3F" : l==="Moderate" ? "#E8A400" : "#2E9E58"; }
function hashNum(s){ let h=0; s=String(s); for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return Math.abs(h); }
function congestionFor(id){
  // Deterministic per-junction model driven by the current time of day
  const h = new Date().getHours() + new Date().getMinutes()/60;
  const peak = Math.max(0, 1 - Math.min(Math.abs(h-9.5), Math.abs(h-19)) / 3);   // 0..1
  const base = (hashNum(id)%40)/100;                                             // 0..0.39
  const score = Math.min(1, base + peak*0.75);
  const level = score>0.66 ? "Heavy" : score>0.36 ? "Moderate" : "Free flowing";
  const wait = Math.round(20 + score*130);
  const speed = Math.round(38 - score*26);
  return {level, wait, speed, score};
}
function haversineKm(a,b){
  const R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  const la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
async function detectTrafficLocation(){
  if(!navigator.geolocation){ state.traffic.error="GPS is not supported on this device."; render(); return; }
  state.traffic.busy=true; state.traffic.error=""; render();
  navigator.geolocation.getCurrentPosition(async pos=>{
    const c = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    state.traffic.center = c;
    state.traffic.label = await reverseGeo(c.lat, c.lng);
    await loadJunctions(c);
  }, err=>{
    state.traffic.busy=false;
    state.traffic.error="Couldn't read your GPS position — allow location access, or use the city centre view.";
    render();
  }, {enableHighAccuracy:true, timeout:12000});
}

async function useMyLocationForTraffic(){
  if(!navigator.geolocation){ state.traffic.destError="Location isn't supported on this device — please search for a starting point instead."; render(); return; }
  state.traffic.destBusy = true; state.traffic.destError=""; render();
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    const label = await reverseGeo(lat,lng);
    state.traffic.routeFrom = {lat,lng,label};
    state.route["trafficfrom"] = {name:"My location", label, lat, lng};
    state.routeText["trafficfrom"] = label;
    const inp = document.getElementById("in-trafficfrom"); if(inp) inp.value = label;
    state.traffic.destBusy = false;
    if(state.traffic.destPoint) computeTrafficRoutes(); else render();
  }, ()=>{
    state.traffic.destBusy=false;
    state.traffic.destError="Couldn't get your location — please search for a starting point instead.";
    render();
  }, {enableHighAccuracy:true, timeout:10000});
}
function swapTrafficRoute(){
  const f = state.route["trafficfrom"], d = state.route["trafficdest"];
  state.route["trafficfrom"] = d; state.route["trafficdest"] = f;
  const ft = state.routeText["trafficfrom"], dt = state.routeText["trafficdest"];
  state.routeText["trafficfrom"] = dt; state.routeText["trafficdest"] = ft;
  state.traffic.routeFrom = d ? {lat:d.lat, lng:d.lng, label:d.label} : null;
  state.traffic.destPoint = f ? {lat:f.lat, lng:f.lng, label:f.label} : null;
  if(state.traffic.routeFrom && state.traffic.destPoint) computeTrafficRoutes(); else render();
}
function clearTrafficDest(){

/* Route-traffic computation is entirely self-contained: it only ever uses the From/To points the
   person picked here, never the "near you" GPS/city-centre state used by the section above — so
   the traffic shown is always for a trip the person actually chose, never roads they aren't
   travelling on. */
async function computeTrafficRoutes(){
  const t = state.traffic;
  if(!t.routeFrom || !t.destPoint) return;
  t.destBusy = true; t.destError=""; t.routeOptions=[]; t.routeJunctions=[]; render();
  try{
    const from = t.routeFrom, to = t.destPoint;
    const url = `https://routing.openstreetmap.de/routed-car/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson&steps=false&alternatives=true`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("routing failed");
    const j = await res.json();
    if(!j.routes || !j.routes.length) throw new Error("no route");
    const opts = j.routes.map(r=>({distance:r.distance, duration:r.duration, coords:r.geometry.coordinates.map(c=>[c[1],c[0]])}));
    opts.sort((a,b)=>a.duration-b.duration); // fastest (most efficient) first
    t.routeOptions = opts;
    t.selectedRouteIdx = 0;
    t.destBusy = false;
    render();
    loadTrafficAlongRoute(); // fire-and-forget — fetches signals for the WHOLE route, re-renders when ready
  }catch(e){
    t.destBusy = false;
    t.destError = "Couldn't compute a route right now — please try again in a moment.";
    render();
  }
}
function selectTrafficRoute(i){

  state.route.to = {name:t.destPoint.label, label:t.destPoint.label, lat:t.destPoint.lat, lng:t.destPoint.lng};
  state.routeText.from = state.route.from.label;
  state.routeText.to = state.route.to.label;

/* Approximate distance from a point to a route by sampling the route's coordinates — accurate
   enough at city scale and far cheaper than true point-to-segment projection. */
function minDistToRouteKm(pt, coords){
  let min = Infinity;
  const step = Math.max(1, Math.floor(coords.length/300));
  for(let i=0;i<coords.length;i+=step){
    const d = haversineKm(pt, {lat:coords[i][0], lng:coords[i][1]});
    if(d<min) min=d;
    if(min<0.05) break;
  }
  return min;
}
/* Index of the nearest route coordinate to a point — used only to sort along-route crossings in
   travel order (origin → destination), never for distance. */
function nearestRouteIndex(pt, coords){
  let best=0, bestD=Infinity;
  const step = Math.max(1, Math.floor(coords.length/400));
  for(let i=0;i<coords.length;i+=step){
    const d = haversineKm(pt, {lat:coords[i][0], lng:coords[i][1]});
    if(d<bestD){ bestD=d; best=i; }
  }
  return best;
}
function routeBoundingBox(coords){
  let south=90, north=-90, west=180, east=-180;
  coords.forEach(([lat,lng])=>{
    if(lat<south) south=lat; if(lat>north) north=lat;
    if(lng<west) west=lng; if(lng>east) east=lng;
  });
  const pad=0.006; // ~650 m buffer so signals right at the route's edge aren't missed
  return {south:south-pad, west:west-pad, north:north+pad, east:east+pad};
}
/* Fetches every mapped traffic signal / junction along the WHOLE selected route (however long it
   is) so the destination search shows live status for the entire road, all the way to the
   destination — never limited to a 3 km radius, and never mixed with unrelated "near you" roads. */
async function loadTrafficAlongRoute(){
  const t = state.traffic;
  const active = (t.routeOptions||[])[t.selectedRouteIdx||0];
  if(!active){ t.routeJunctions=[]; render(); return; }
  const origin = t.routeFrom || SURAT;

  // Show a route-specific result immediately using the known Surat junction database.
  // This prevents the UI from blocking on a slow third-party Overpass server.
  let immediate = KNOWN_JUNCTIONS
    .map(kj=>({id:"k"+kj.name, name:kj.name, lat:kj.lat, lng:kj.lng, signal:true}))
    .map(n=>({...n, distFromRoute:minDistToRouteKm(n, active.coords)}))
    .filter(n=>n.distFromRoute<=0.8);
  immediate.forEach(n=>{ n._idx=nearestRouteIndex(n, active.coords); n.km=haversineKm(origin,n); });
  immediate.sort((a,b)=>a._idx-b._idx);
  immediate = immediate.slice(0,12);
  t.routeJunctions = immediate;
  t.routeJunctionsSource = immediate.length ? "Route-specific junction database · updating from OpenStreetMap" : "Searching for mapped crossings…";
  t.routeJunctionsBusy = true;
  render();

  // Query only small corridors around sampled points on the selected route.
  // This is much faster than querying one huge bounding box for a long route.
  try{
    const coords=active.coords||[];
    const sampleCount=Math.min(12, Math.max(4, Math.ceil(coords.length/120)));
    const samples=[];
    for(let i=0;i<sampleCount;i++){
      const idx=Math.round(i*(coords.length-1)/(sampleCount-1));
      if(coords[idx]) samples.push(coords[idx]);
    }
    const clauses=samples.map(([lat,lng])=>`node(around:500,${lat},${lng})[highway=traffic_signals];node(around:500,${lat},${lng})[highway=motorway_junction];`).join('');
    const q=`[out:json][timeout:6];(${clauses});out body 120;`;
    const j=await overpassFetch(q,6000);
    let list=(j.elements||[]).map(n=>({
      id:"n"+n.id,
      name:(n.tags && (n.tags.name || n.tags["junction:ref"] || n.tags.ref)) || null,
      lat:n.lat,lng:n.lon,
      signal:!(n.tags && n.tags.highway==="motorway_junction")
    }));
    list=list.map(n=>({...n,distFromRoute:minDistToRouteKm(n,active.coords)})).filter(n=>n.distFromRoute<=0.45);
    list.forEach(n=>{n._idx=nearestRouteIndex(n,active.coords);n.km=haversineKm(origin,n);});
    list.sort((a,b)=>a._idx-b._idx);
    list=list.slice(0,40);
    if(list.length){
      list.forEach((n,i)=>{if(!n.name)n.name=`Crossing ${i+1} on route`;});
      t.routeJunctions=list;
      t.routeJunctionsSource="OpenStreetMap mapped junctions along selected route";
    }
  }catch(e){
    // Keep the immediate route-specific fallback already displayed.
    t.routeJunctionsSource = immediate.length ? "Route-specific junction database · OSM update unavailable" : "No mapped crossings found on selected route";
  }
  t.routeJunctionsBusy=false;
  render();
}

function fallbackJunctions(c){
  let list = KNOWN_JUNCTIONS
    .map(j=>({id:"k"+j.name, name:j.name, lat:j.lat, lng:j.lng, km:haversineKm(c,j), signal:true}))
    .filter(j=>j.km <= TRAFFIC_RADIUS_M/1000);
  if(!list.length){
    // generate the crossing ring around the detected point so the radius view still works
    const dirs = [[0.011,0],[0,0.012],[-0.012,0],[0,-0.011],[0.008,0.009],[-0.009,0.008],[0.017,0.012],[-0.016,-0.013]];
    list = dirs.map((d,i)=>({id:"g"+i+Math.round(c.lat*1000), name:`Crossing ${i+1} near your location`,
      lat:c.lat+d[0], lng:c.lng+d[1], km:haversineKm(c,{lat:c.lat+d[0],lng:c.lng+d[1]}), signal:true}));
  }
  return list.sort((a,b)=>a.km-b.km);
}
async function overpassFetch(q, timeoutMs=6000){
  const attempts=OVERPASS_ENDPOINTS.map(ep=>new Promise(async(resolve,reject)=>{
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),timeoutMs);
    try{
      const res=await fetch(ep,{method:"POST",body:"data="+encodeURIComponent(q),signal:ctl.signal});
      clearTimeout(timer);
      if(!res.ok) return reject(new Error("status "+res.status));
      resolve(await res.json());
    }catch(e){
      clearTimeout(timer);
      reject(e);
    }
  }));
  try{ return await Promise.any(attempts); }
  catch(e){ throw new Error("overpass unavailable"); }
}
async function loadJunctions(c){
  state.traffic.busy = true; render();

  try{
    const j = await overpassFetch(q);
    let list = (j.elements||[]).map((n,i)=>({
      id: "n"+n.id,
      name: (n.tags && (n.tags.name || n.tags["junction:ref"] || n.tags.ref)) || null,
      lat: n.lat, lng: n.lon,
      km: haversineKm(c, {lat:n.lat, lng:n.lon}),
      signal: !(n.tags && n.tags.highway==="motorway_junction"),
    })).filter(n=>n.km <= TRAFFIC_RADIUS_M/1000);
    list.sort((a,b)=>a.km-b.km);
    list = list.slice(0,24);
    list.forEach((n,i)=>{ if(!n.name) n.name = `Crossing ${i+1} · ${n.km.toFixed(1)} km away`; });
    state.traffic.junctions = list;
    state.traffic.updated = new Date();
    state.traffic.busy = false;
    if(!list.length){
      state.traffic.junctions = fallbackJunctions(c);
      state.traffic.source = "Offline junction database";
    }else{
      state.traffic.source = "Live OpenStreetMap junction data";
    }
    render();
  }catch(e){
    state.traffic.junctions = fallbackJunctions(c);
    state.traffic.updated = new Date();
    state.traffic.source = "Offline junction database (live OSM query busy)";
    state.traffic.busy = false;

  }

function drawTrafficMap(){

    const map = makeMap("trafficMap", t.routeFrom, 13);
    if(!map) return;
    const opts = t.routeOptions;
    const activeIdx = t.selectedRouteIdx||0;
    let activeCoords = null;
    opts.forEach((r,i)=>{
      const isActive = i===activeIdx;
      L.polyline(r.coords, {color:isActive?"#5A4BD1":"#98A9C2", weight:isActive?6:3, opacity:isActive?0.95:0.55, dashArray:isActive?null:"6 8"}).addTo(map);
      if(isActive) activeCoords = r.coords;
    });
    L.marker([t.routeFrom.lat, t.routeFrom.lng]).addTo(map).bindPopup("<b>From</b><br>"+(t.routeFrom.label||""));
    L.marker([t.destPoint.lat, t.destPoint.lng]).addTo(map).bindPopup("<b>To</b><br>"+(t.destPoint.label||""));
    (t.routeJunctions||[]).forEach(n=>{
      const cg = congestionFor(n.id);
      L.circleMarker([n.lat,n.lng],{radius:9, color:"#fff", weight:2, fillColor:levelColor(cg.level), fillOpacity:.95})
        .addTo(map)
        .bindPopup(`<b>${n.name}</b><br>${cg.level} · avg ${cg.speed} km/h<br>Typical wait ${cg.wait}s · ${n.km.toFixed(1)} km from start`);

      .concat([[t.routeFrom.lat,t.routeFrom.lng],[t.destPoint.lat,t.destPoint.lng]]);
    if(activeCoords) activeCoords.forEach((p,i)=>{ if(i%8===0) boundsPts.push(p); });

  (t.junctions||[]).forEach(n=>{
    const cg = congestionFor(n.id);

      .addTo(map)
      .bindPopup(`<b>${n.name}</b><br>${cg.level} · avg ${cg.speed} km/h<br>Typical wait ${cg.wait}s · ${n.km.toFixed(2)} km away`);
  });
  state.accidentAlerts.forEach(a=>{
    if(a.lat && a.lng) L.marker([a.lat,a.lng]).addTo(map).bindPopup(`<b>Incident:</b> ${a.location}<br>${a.desc}`);
  });
  const boundsPts = (t.junctions||[]).map(n=>[n.lat,n.lng]).concat([[c.lat,c.lng]]);
  if(boundsPts.length){
    map.fitBounds(L.latLngBounds(boundsPts).pad(0.15), {animate:false});
  }
